# The Data Plane management façade contract: the administrative surface the
# Control Plane reaches, which is internal. It is reachable from the Control
# Plane and from nobody else (ADR 0006 §11).
#
# This document is the contract of **dataplane-api**, the façade — the process a
# contracted caller actually opens a socket to. It is not the contract of
# `dataplane`. That application's process is the domain and persistence authority
# and it serves a listener of its own behind this one; the hop between the two is
# a private protocol between two processes of the same product, defined in
# docs/architecture/cross-plane-protocols.md and pinned on each side by a
# protocol test. It is deliberately not a fourth OpenAPI document: a document
# exists to state what a caller outside this repository may rely on, and nothing
# outside this repository reaches that hop. The distinction is load-bearing
# rather than pedantic — the two hops answer in the same envelope and do not
# share a failure vocabulary, and `502 upstream_unavailable` below is the clearest
# proof: it is this façade's word for "the Data Plane did not answer", which is
# not a sentence the Data Plane could say about itself.
#
# There is no generated client for this document and no browser is meant to
# see it. It is written down anyway, and for the same reason the other two are:
# a surface without a contract is a surface whose shape is decided by whichever
# implementation touches it last. What the contract buys here is narrower than
# on the console's side — no public consumer, no published client — but it is
# the same thing in kind: an answer to "what does this application serve",
# stated once, ahead of the code.
#
# The runtime is not here. `POST /v1/chat/completions` and the rest of the
# OpenAI-compatible surface belong to `runtime.yaml` and to a different
# process: a management API sized for administrative traffic must never be on
# the LLM request path, and a contract that carried both would be the first
# place that assumption stopped being visible.
#
# Two operations here are unusual, and they are the two the Control Plane's
# money depends on: `GET /internal/usage-events` and
# `GET /internal/alias-groups/{group_name}/versions/current` read facts *back*
# from the Data Plane, where every other operation in this document asks it to
# change something. The fact feed's delivery model, its cursor, and why it is a
# pull rather than a push are stated in `shared/usage-facts.yaml`, and the shape
# of what crosses is there too. The catalog read's answer is smaller and no
# less load-bearing: the version of an alias group that is currently current,
# whose immutable id is what an entitlement stores as its scope (ADR 0006 §7) —
# and the immutability that makes storing it safe is the catalog's own (ADR
# 0003), not this surface's promise.
openapi: 3.1.0
info:
  title: Ecoma LLM Gateway — Data Plane management façade API
  version: 0.1.0
  description: >-
    Health and readiness probes, the usage-fact feed, the alias-group catalog
    read, and the common HTTP boundary of the Ecoma LLM Gateway's Data Plane
    management façade. This surface is internal: it is called by the Control
    Plane and is not published to callers of the gateway. Every response returns
    X-Request-Id, and every failure — including the ones no operation declares, a
    404 for an unmatched path and a 500 for an unclassifiable implementation
    failure — returns the ErrorEnvelope. A management call identifies itself as a
    service; a browser session or a customer API key is not a service identity
    and is refused. The Data Plane's administrative operations beyond the fact
    feed and the catalog read are not designed yet; this document carries the
    surface that exists and the process every later operation follows.

    This is a façade contract and not the Data Plane's own surface. The process
    behind it serves a private protocol that is not contracted here; what a
    caller of this document sees is the façade's answer, produced by the façade
    from what it could read, and never a byte relayed from the process behind it.
servers:
  - url: /
tags:
  - name: probes
    description: >-
      Process probes. All three applications in this repository serve the same
      trio, and each document declares its own copy of the tag because each
      document is read on its own; the tag is where a reader sees that they are
      one convention rather than three unrelated endpoints.
  - name: usage
    description: >-
      The usage-fact feed: the one place a caller reads the Data Plane's
      recorded facts rather than asking it to change something. Its delivery
      model is stated in shared/usage-facts.yaml.
  - name: catalog
    description: >-
      The model catalog facts a caller reads back: which version of an alias
      group is currently current. The catalog itself — its members, its bounds
      and its immutability — is Data Plane data (ADR 0006 §5); what crosses here
      is the one fact a Control Plane commerce roll needs to pin an entitlement's
      scope, and it arrives as a version's id and nothing else.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - probes
      summary: Liveness of the Data Plane management process
      description: >-
        Returns 200 while the process is able to serve. Anything more than
        "is the process alive" belongs to /readyz, not here.
      security: []
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - probes
      summary: Readiness of the Data Plane management service
      description: >-
        Returns 200 when the service may receive traffic. It answers 200
        unconditionally today: the scaffold has no dependencies to check, and
        this application holds no state of its own and reads no database, so
        there is nothing yet for the probe to report on. When the façade reaches
        the Data Plane for management state, this is the probe that should carry
        that check — a question about reaching the Data Plane it manages, never
        about a database connection this process owns.
      security: []
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The service is ready to receive traffic.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
  /version:
    get:
      operationId: getVersion
      tags:
        - probes
      summary: Build version of the Data Plane management service
      description: >-
        Returns the version stamped into the dataplane-api binary at build time.
        It is the repository release version when the release lane supplies
        one, and "dev" for an unstamped local build.
      security: []
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The build version of the Data Plane management service.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/Version"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
  /internal/usage-events:
    get:
      operationId: listUsageEvents
      tags:
        - usage
      summary: Read the Data Plane's usage facts
      description: >-
        Returns a page of the immutable facts the runtime recorded, in the order
        it recorded them, for the Control Plane to derive settlement from. The
        model — an opaque cursor, replay instead of acknowledgement, a
        consumer-owned position, and `request_id` as the idempotency key — is
        stated once in `shared/usage-facts.yaml` and is not repeated here.


        Two properties of this operation are worth stating on the wire. First,
        it is read-only: there is no operation anywhere on this surface that
        acknowledges, consumes, deletes or marks a fact as delivered, so a
        control-plane outage loses nothing and a redelivered fact costs
        nothing. Second, it answers from the Data Plane and never from here:
        this application holds no facts, no cursor and no cache of either, and
        when the runtime cannot be reached the answer is a 502 rather than a
        guess.


        A management caller authenticates as a service — see the
        `serviceCredential` scheme below. The Control Plane reaches this
        operation, and this operation only, on the façade; the process behind
        the façade is reached in turn over a private protocol that is not
        contracted here, and it authenticates the façade with its own credential
        rather than the caller's. So the 401 below is about *this* caller, and
        the 502 is what a caller sees when the hop behind the façade did not
        answer — two different hops, two different secrets, and a caller that
        held one could not present it to the other. The runtime's public surface
        (`runtime.yaml`) does not carry this operation at all, and the LLM
        request path never touches it.
      security:
        - serviceCredential: []
      parameters:
        - $ref: "./shared/usage-facts.yaml#/components/parameters/UsageEventsAfter"
        - $ref: "./shared/usage-facts.yaml#/components/parameters/UsageEventsLimit"
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: A page of usage facts.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/usage-facts.yaml#/components/schemas/UsageFactPage"
        "400":
          $ref: "./shared/errors.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./shared/errors.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "410":
          $ref: "./shared/errors.yaml#/components/responses/CursorExpired"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
        "502":
          $ref: "./shared/errors.yaml#/components/responses/UpstreamUnavailable"
  /internal/alias-groups/{group_name}/versions/current:
    get:
      operationId: getCurrentAliasGroupVersion
      tags:
        - catalog
      summary: Read the current version of an alias group
      description: >-
        Returns the version of the named alias group that is currently current —
        the group's highest version, under the catalog's own rule that a
        membership change opens a new version and never edits an existing one.
        The answer is what a Control Plane commerce roll needs before it can
        write anything of its own: an entitlement pins the returned
        `group_version_id` as its scope, and the id — never the number — is what
        it stores, because the number's meaning moves when the group rolls while
        the id is contracted to keep naming the same membership forever.


        The answer is read from the Data Plane and never from here, exactly as
        the usage feed above is: this façade holds no catalog and no cache of
        one, and when the process behind it cannot be reached the answer is a
        502 rather than a stale guess. What it holds is a decision about the
        answer's shape: the version's membership does not cross, because which
        aliases a version contains is the runtime's question, asked inside the
        Data Plane when it admits a request — the Control Plane resolves what an
        entitlement grants by id, and never needs the member list to do it.


        A 404 is an answer and not a failure: it says the catalog holds no
        version of that group, which is the state of a group that has not been
        provisioned. The wildcard name `*` is not special here — it is an
        ordinary group name to the catalog and is read the same way, so a read
        of it before the wildcard's singleton version was provisioned misses
        exactly like any other unprovisioned group. A caller acts on a 404; it
        does not retry it.


        The name is carried as one path segment, percent-encoded by the caller
        where its own characters would end the segment (`*` may travel raw or
        as `%2A`; a `/` inside a name must be `%2F`). Nothing about the name is
        validated beyond that structure: a name this catalog does not hold is
        answered with the 404 above rather than a 400, because the group-name
        grammar is the catalog's own and a façade that copied it would be a
        second definition of it.


        A management caller authenticates as a service — see the
        `serviceCredential` scheme below. As with the usage feed, the 401 is
        about *this* caller and the 502 is about the hop behind this façade.
      security:
        - serviceCredential: []
      parameters:
        - name: group_name
          in: path
          required: true
          description: >-
            The alias group's name, exactly as the catalog stores it — the
            wildcard `*` included. One path segment; percent-encoded where the
            name's own characters would end the segment.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The group's current version.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAliasGroupVersion"
        "401":
          $ref: "./shared/errors.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
        "502":
          $ref: "./shared/errors.yaml#/components/responses/UpstreamUnavailable"
components:
  securitySchemes:
    serviceCredential:
      type: http
      scheme: bearer
      description: >-
        A service identity presented by a peer application, never by a browser
        and never by a customer. Deployment supplies the credential; the
        security model is stated in ADR 0006 §9, and the transport is expected
        to be replaced by one that proves the identity cryptographically (mTLS
        or a signed credential) without changing this contract.

        This names the credential a caller presents **to the façade**. The
        façade presents a different one to the process behind it, and neither
        hop accepts the other's: a credential is per hop because a hop is where
        it is checked, and a single shared secret across two processes would
        multiply whatever one of them leaked by two.
  schemas:
    CurrentAliasGroupVersion:
      type: object
      description: >-
        The alias group's current version, as the catalog holds it. The three
        fields are the whole of what crosses: a caller that needs to know which
        aliases the version contains asks the plane that evaluates containment,
        and never this one. `group_version_id` is the only value a caller is
        expected to keep; `group_name` and `version` name what was read, and
        the number in particular describes the group as it stands now rather
        than the snapshot forever.
      required:
        - group_name
        - version
        - group_version_id
      properties:
        group_name:
          type: string
          description: >-
            The group's name as the catalog stores it — the requested name, and
            `*` for the wildcard group's singleton.
          minLength: 1
        version:
          type: integer
          description: >-
            The version's number within its group: the group's highest, which is
            what "current" means here. Information rather than a handle — a
            scope pins `group_version_id`.
          minimum: 1
        group_version_id:
          type: string
          format: uuid
          description: >-
            The version's immutable identifier, and the value an entitlement
            stores as its scope. A version, once issued, never changes: a
            membership edit opens a new version with a new id, and every id
            ever returned keeps naming the snapshot it named when it was
            returned.
          minLength: 1
