# The runtime contract: the OpenAI-compatible surface the Data Plane serves,
# and the only contract on the LLM request path.
#
# This is the surface the gateway exists to serve. It is also the one whose
# availability profile is unlike the others: the Control Plane may be down
# while this answers, and a runtime request must never wait on it (ADR 0006
# §4). That is why this document is separate rather than a section of the
# console's: the client generated from `console.yaml` cannot see these paths,
# and the two surfaces' uptime commitments are stated apart because they do not
# move together.
#
# It is also the one whose errors are somebody else's. The other two surfaces
# answer their callers with an envelope this repository designed; this one
# answers clients written against OpenAI, which parse `error.type` and
# `error.message` and will not be re-taught. So the errors here come from
# `shared/runtime-errors.yaml` and from nowhere else — the two vocabularies
# move independently, and a change to the console's envelope cannot reach a
# client of this surface.
#
# Exactly one runtime operation exists today, and it is not implemented. It is
# contracted anyway, as a 501, because the alternative — omitting it — would
# make the boundary invisible: `POST /v1/chat/completions` belongs to this
# application, and a caller who sends one gets an answer that says so rather
# than a 404 that says the path is nothing. The success path is deliberately
# absent: a documented 200 this code cannot produce would be the contract
# claiming a capability that does not exist.
openapi: 3.1.0
info:
  title: Ecoma LLM Gateway — OpenAI-compatible runtime
  version: 0.1.0
  description: >-
    The OpenAI-compatible inference surface of the Ecoma LLM Gateway's Data
    Plane, plus the process probes this application serves. Every response
    returns X-Request-Id. Failures are reported in the OpenAI-compatible shape
    from shared/runtime-errors.yaml: an unmatched path returns it with HTTP 404
    and the `not_found_error` type, a method unsupported by a known path with
    HTTP 405 and `invalid_request_error`, and a contracted operation that is
    not built with HTTP 501, `api_error` and the `not_implemented` code. A
    probe taken while the runtime's own dependencies are not yet answering
    returns HTTP 503 and the `overloaded_error` type.
    A request that fails after the response has started streaming reports the
    failure inside the stream instead, because by then no HTTP status can be
    revised — see the chat-completion operation. The runtime's routing,
    provider and usage behaviour is not designed yet; this document carries the
    surface that exists and the process every later endpoint follows.
servers:
  - url: /
tags:
  - name: probes
    description: >-
      Process probes. All three applications in this repository serve the same
      trio, and each document declares its own copy of the tag because each
      document is read on its own; the tag is where a reader sees that they are
      one convention rather than three unrelated endpoints.
  - name: runtime
    description: >-
      The OpenAI-compatible inference surface. This is the only tag in any of
      the three documents that carries a caller's traffic rather than an
      operator's.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - probes
      summary: Liveness of the runtime process
      description: >-
        Returns 200 while the process is able to serve. This is the endpoint an
        orchestrator restarts the runtime on, and it stays a statement about
        the process: an upstream provider being unreachable is not a reason to
        restart the gateway that would talk to it.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/runtime-errors.yaml#/components/responses/ServiceUnavailable"
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - probes
      summary: Readiness of the runtime service
      description: >-
        Returns 200 when the service may receive traffic, and 503 while one of
        the runtime's own dependencies is not there yet — its database
        unreachable, or its credential projection not yet bootstrapped: until
        the first snapshot has been applied there is no mirror to admit a
        request against (ADR 0007). The Control Plane is never among the
        dependencies: the runtime is ready when it can serve an inference
        request, and it can do that while the Control Plane is down.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The service is ready to receive traffic.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/runtime-errors.yaml#/components/responses/ServiceUnavailable"
  /version:
    get:
      operationId: getVersion
      tags:
        - probes
      summary: Build version of the runtime service
      description: >-
        Returns the version stamped into the dataplane binary at build time. It
        is the repository release version when the release lane supplies one,
        and "dev" for an unstamped local build.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The build version of the runtime service.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/Version"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags:
        - runtime
      summary: Create a chat completion
      description: >-
        The OpenAI-compatible chat completion endpoint. It is contracted and
        not implemented: the routing, provider and accounting behaviour behind
        it is not designed yet, and this operation answers 501 with the
        `not_implemented` code until it is.


        The request body is a pass-through — the OpenAI-compatible request
        shape, forwarded as received — and is not asserted on, because the
        scaffold neither validates nor forwards it. Whatever the caller sends
        gets the same 501.


        **How a failure is reported depends on whether the response has been
        committed**, which for a streamed answer happens at the first
        content-bearing byte written to the client, and is a separate question
        from whether a candidate has been chosen (see
        docs/architecture/routing.md; commitment is what freezes a candidate
        and ends fallback):


        - *Before commitment* the failure is ordinary HTTP — a status code and
          the error body from shared/runtime-errors.yaml. Several candidates
          may have failed to reach this point and the caller still sees one
          error, because pre-commitment fallback is the runtime's own business.


        - *After commitment* no status can be revised, so the failure is
          written into the stream: one Server-Sent Event `data:` frame whose
          payload is the same JSON error body, then the terminal `data: [DONE]`
          frame, then the stream closes. The client learns that the answer it
          has already begun rendering ended in failure instead of waiting for a
          connection that will never finish. The `type` names the class — a
          provider failure mid-stream is an `api_error`, never an
          `invalid_request_error`.


        - *A client disconnect* writes nothing at all: there is no channel left
          to report on, and a caller that has gone away cannot read a report.
          The observation belongs to the runtime's usage facts, and the billable
          quantity is what was already forwarded.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      requestBody:
        required: false
        description: >-
          The OpenAI-compatible chat completion request. Forwarded as received
          once this operation is implemented; not inspected today.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "501":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotImplemented"
