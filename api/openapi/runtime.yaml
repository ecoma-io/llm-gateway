# The runtime contract: the OpenAI-compatible surface the Data Plane serves,
# and the only contract on the LLM request path.
#
# This is the surface the gateway exists to serve. It is also the one whose
# availability profile is unlike the others: the Control Plane may be down
# while this answers, and a runtime request must never wait on it (ADR 0006
# §4). That is why this document is separate rather than a section of the
# console's: the client generated from `console.yaml` cannot see these paths,
# and the two surfaces' uptime commitments are stated apart because they do not
# move together.
#
# It is also the one whose errors are somebody else's. The other two surfaces
# answer their callers with an envelope this repository designed; this one
# answers clients written against OpenAI, which parse `error.type` and
# `error.message` and will not be re-taught. So the errors here come from
# `shared/runtime-errors.yaml` and from nowhere else — the two vocabularies
# move independently, and a change to the console's envelope cannot reach a
# client of this surface.
#
# `POST /v1/chat/completions` is the one operation on the LLM request path, and
# what this document contracts of it is admission: who the caller is, what they
# are entitled to, and whether the runtime reserves the spend the request
# implies. Every refusal that admission can produce is declared, so a caller
# can branch on the answer; the successful completion response is deliberately
# absent — the runtime admits a request and hands it to its routing half, and
# the shape of what routing streams back is contracted when that half lands. A
# documented 200 this code cannot produce would be the contract claiming a
# capability that does not exist.
openapi: 3.1.0
info:
  title: Ecoma LLM Gateway — OpenAI-compatible runtime
  version: 0.1.0
  description: >-
    The OpenAI-compatible inference surface of the Ecoma LLM Gateway's Data
    Plane, plus the process probes this application serves. Every response
    returns X-Request-Id. Failures are reported in the OpenAI-compatible shape
    from shared/runtime-errors.yaml: an unmatched path returns it with HTTP 404
    and the `not_found_error` type, and a method unsupported by a known path
    with HTTP 405 and `invalid_request_error`. A probe taken while the
    runtime's own dependencies are not yet answering returns HTTP 503 and the
    `overloaded_error` type.
    A request that fails after the response has started streaming reports the
    failure inside the stream instead, because by then no HTTP status can be
    revised — see the chat-completion operation. The runtime's routing,
    provider and usage behaviour is not designed yet; this document carries the
    surface that exists and the process every later endpoint follows.
servers:
  - url: /
tags:
  - name: probes
    description: >-
      Process probes. All three applications in this repository serve the same
      trio, and each document declares its own copy of the tag because each
      document is read on its own; the tag is where a reader sees that they are
      one convention rather than three unrelated endpoints.
  - name: runtime
    description: >-
      The OpenAI-compatible inference surface. This is the only tag in any of
      the three documents that carries a caller's traffic rather than an
      operator's.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - probes
      summary: Liveness of the runtime process
      description: >-
        Returns 200 while the process is able to serve. This is the endpoint an
        orchestrator restarts the runtime on, and it stays a statement about
        the process: an upstream provider being unreachable is not a reason to
        restart the gateway that would talk to it.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/runtime-errors.yaml#/components/responses/ServiceUnavailable"
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - probes
      summary: Readiness of the runtime service
      description: >-
        Returns 200 when the service may receive traffic, and 503 while one of
        the runtime's own dependencies is not there yet — its database
        unreachable, or its credential projection not yet bootstrapped: until
        the first snapshot has been applied there is no mirror to admit a
        request against (ADR 0007). The Control Plane is never among the
        dependencies: the runtime is ready when it can serve an inference
        request, and it can do that while the Control Plane is down.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The service is ready to receive traffic.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/runtime-errors.yaml#/components/responses/ServiceUnavailable"
  /version:
    get:
      operationId: getVersion
      tags:
        - probes
      summary: Build version of the runtime service
      description: >-
        Returns the version stamped into the dataplane binary at build time. It
        is the repository release version when the release lane supplies one,
        and "dev" for an unstamped local build.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The build version of the runtime service.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/Version"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags:
        - runtime
      summary: Create a chat completion
      security:
        - runtimeCredential: []
      description: >-
        The OpenAI-compatible chat completion endpoint. Sending one is how a
        caller asks the runtime to admit and serve a completion, and admission
        is what this operation contracts: the presented API key is verified
        against the Data Plane's own credential mirror, the requested model is
        resolved through the plane-local catalog, the caller's entitlements and
        pay-as-you-go balance are walked for capacity, and the spend the
        request implies is reserved atomically before any upstream is contacted.


        **Authentication.** The caller presents its API key as a bearer
        credential. A request whose credential the runtime cannot verify is
        answered 401 with the `invalid_api_key` code — one message for every
        cause, so the answer never says which part of verification failed. A
        key whose account is suspended or closed is answered 403 instead: the
        caller is known, and the refusal is an account decision, not a
        verification failure.


        **Idempotency.** The `Idempotency-Key` header is required. A client
        retrying after a timeout must be able to repeat its request without
        executing it twice, and the key is how the runtime tells a repeat from
        a new request: the key is stored with a digest of the request body, so
        the same key with the same body is answered from the original's
        outcome — the response carries `Idempotency-Replay: true` and
        `X-Original-Request-Id` whenever it is a replay — while the same key
        with a different body is refused with the `idempotency_conflict` code
        and never retried with the same key. A request whose key is still
        being processed is answered 409 `request_in_progress` with a short
        `Retry-After` hint.


        **The request body.** `model` and `messages` are required; at least one
        of `max_tokens` and `max_completion_tokens` must be present, and when
        both are, they must agree — the pair is one ceiling on generated
        output. A body larger than 10485760 bytes is refused with HTTP 400 and
        never with 413: the request was not read to be forwarded, and an
        oversized body is an invalid request, not a payload the runtime chose
        not to carry. A body that cannot be read or parsed is refused 400 the
        same way, and no idempotency record is written for a request refused
        before its body was accepted.


        **Capacity.** Admission walks the caller's entitlements first and
        pay-as-you-go balance second, and reserves what the request can spend
        — priced from the catalog's effective price list at the moment of
        admission. A request whose capacity comes up short is answered 429
        `insufficient_quota`; a caller holding no entitlement and no balance at
        all is answered 403 `no_access`. A request the runtime cannot route to
        any candidate is answered 503 with a `Retry-After`, because the
        condition is expected to clear.


        **How a failure is reported depends on whether the response has been
        committed**, which for a streamed answer happens at the first
        content-bearing byte written to the client, and is a separate question
        from whether a candidate has been chosen (see
        docs/architecture/routing.md; commitment is what freezes a candidate
        and ends fallback):


        - *Before commitment* the failure is ordinary HTTP — a status code and
          the error body from shared/runtime-errors.yaml. Several candidates
          may have failed to reach this point and the caller still sees one
          error, because pre-commitment fallback is the runtime's own business.


        - *After commitment* no status can be revised, so the failure is
          written into the stream: one Server-Sent Event `data:` frame whose
          payload is the same JSON error body, then the terminal `data: [DONE]`
          frame, then the stream closes. The client learns that the answer it
          has already begun rendering ended in failure instead of waiting for a
          connection that will never finish. The `type` names the class — a
          provider failure mid-stream is an `api_error`, never an
          `invalid_request_error`.


        - *A client disconnect* writes nothing at all: there is no channel left
          to report on, and a caller that has gone away cannot read a report.
          The observation belongs to the runtime's usage facts, and the billable
          quantity is what was already forwarded.


        The successful completion response is not part of this document yet: it
        is contracted when the routing half that streams it lands.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            The client-chosen key that makes a retry after a timeout safe. The
            runtime stores it byte-for-byte beside a digest of the request
            body: the same key with the same body replays the original's
            outcome, the same key with a different body is refused. Refused
            rather than truncated outside 1–256 printable ASCII characters, so
            two distinct client keys can never become one stored key.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[!-~]+$"
      requestBody:
        required: true
        description: >-
          The OpenAI-compatible chat completion request. The runtime reads it
          to admit it — who is asking, for which model, at what ceiling — and
          digests the raw bytes for idempotency; it forwards nothing it has not
          admitted.
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
                  description: >-
                    The model alias requested. A value outside this grammar is
                    a malformed request, answered 400 with `model` named in
                    `param`; a well-formed name no alias carries is answered
                    404 with the `model_not_found` code.
                messages:
                  type: array
                  description: >-
                    The conversation so far, in the OpenAI-compatible message
                    shape. The runtime prices the prompt from what it actually
                    reads once routing is built; today the count must be
                    non-empty for a request to be admissible.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content: {}
                max_tokens:
                  type: integer
                  minimum: 1
                  description: >-
                    The ceiling on generated output. Optional when
                    `max_completion_tokens` is present; when both are present
                    they must agree, and a disagreement is refused 400.
                max_completion_tokens:
                  type: integer
                  minimum: 1
                  description: >-
                    The OpenAI-compatible spelling of the same ceiling.
                    Optional when `max_tokens` is present; when both are
                    present they must agree, and a disagreement is refused 400.
                stream:
                  type: boolean
                  default: false
                  description: >-
                    Whether the completion is to be streamed as Server-Sent
                    Events. Admission reserves the same hold either way; the
                    streaming response shape itself is contracted with routing.
              additionalProperties: true
      x-max-body-bytes: 10485760
      responses:
        "400":
          $ref: "./shared/runtime-errors.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./shared/runtime-errors.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./shared/runtime-errors.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./shared/runtime-errors.yaml#/components/responses/ModelNotFound"
        "405":
          $ref: "./shared/runtime-errors.yaml#/components/responses/MethodNotAllowed"
        "409":
          $ref: "./shared/runtime-errors.yaml#/components/responses/Conflict"
        "429":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InsufficientQuota"
        "500":
          $ref: "./shared/runtime-errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/runtime-errors.yaml#/components/responses/NoCandidate"
components:
  securitySchemes:
    runtimeCredential:
      type: http
      scheme: bearer
      description: >-
        A customer API key minted by the Control Plane, presented as the bearer
        credential. The runtime never mints keys and never sees a secret — only
        the digest the credential mirror projects — so the key is verified
        against the Data Plane's own mirror and no Control Plane call sits on
        this path (ADR 0007). This scheme is the runtime's customer credential,
        declared here because this is the only surface a customer's key
        reaches; the management façade's service credential is a different
        scheme in a different document.
