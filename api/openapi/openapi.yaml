# The API contract of the Ecoma LLM Gateway.
#
# This document names exactly the public surface the service implements today:
# infrastructure probes and the boundary every later product endpoint shares.
# The gateway's product domains (providers, routing, keys, usage) are not
# designed yet; when one arrives, its contract changes here first and the
# implementation follows it, never the reverse. See AGENTS.md, "The contract
# is the API contract".
openapi: 3.1.0
info:
  title: Ecoma LLM Gateway API
  version: 0.1.0
  description: >-
    Health and readiness probes plus the common HTTP boundary of the Ecoma LLM
    Gateway API service. Every response returns X-Request-Id. An unmatched path
    returns the ErrorEnvelope with HTTP 404; a method unsupported by a known
    path returns it with HTTP 405. The gateway's product endpoints are not
    designed yet; this document carries the surface that exists and the process
    every later endpoint follows.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness of the API process
      description: >-
        Returns 200 while the process is able to serve. Anything more than
        "is the process alive" belongs to /readyz, not here.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness of the API service
      description: >-
        Returns 200 when the service may receive traffic. The scaffold has no
        dependencies, so it is always ready; the future dependency checks hang
        off this endpoint.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The service is ready to receive traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /version:
    get:
      operationId: getVersion
      summary: Build version of the API service
      description: >-
        Returns the version stamped into the gateway binary at build time. It
        is the repository release version when the release lane supplies one,
        and "dev" for an unstamped local build.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The build version of the API service.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        An optional caller-generated request identifier. The gateway accepts it
        only when it is 1–64 ASCII letters, digits, periods, underscores, or
        hyphens; otherwise it generates a new identifier. The chosen identifier
        is returned in the X-Request-Id response header and, for errors, in the
        ErrorEnvelope request_id field.
      schema:
        $ref: "#/components/schemas/RequestId"
  headers:
    RequestId:
      description: >-
        The request identifier accepted from the caller or generated by the
        gateway. It is safe for bounded correlation in logs and client reports.
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    MethodNotAllowed:
      description: The resource exists but does not accept the request method.
      headers:
        Allow:
          description: The methods supported by this resource.
          required: true
          schema:
            type: string
            example: GET, HEAD
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._-]{1,64}$"
      description: >-
        A bounded, safe-to-log request correlation identifier. The gateway uses
        a generated identifier when a supplied header does not meet this shape.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: '"ok" today; the vocabulary grows only through this contract.'
      additionalProperties: false
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: The build version injected through the gateway binary's ldflags.
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          $ref: "#/components/schemas/RequestId"
      additionalProperties: false
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - not_found
            - method_not_allowed
            - internal
          description: A stable machine-readable category for the failure.
        message:
          type: string
          description: >-
            A human-readable explanation safe to present to a client. Internal
            implementation details and stack traces never appear here.
      additionalProperties: false
