# The Console API contract: the Control Plane's public surface, and the only
# one of the gateway's three contracts a browser reaches.
#
# This document is the whole of what a console client can see. Nothing on the
# Data Plane's runtime appears here, deliberately: an inference request is not
# a browser call, and a client generated from this document has no type for one
# to be made with (ADR 0006 §4, §5). The Data Plane's management API is absent
# for the same reason in the other direction — it is internal, and a public
# contract that described it would be describing a surface nobody outside the
# deployment may call (§11).
#
# `packages/console-api-client` is generated from this file and from nothing
# else, so the boundary between the two planes is legible in the client's type
# surface rather than only in this comment.
#
# The gateway's product domains (accounts, keys, subscriptions, usage) are
# not designed yet. When one arrives, its contract changes here first and the
# implementation follows it, never the reverse — see AGENTS.md, "The API
# contract is the OpenAPI document". The usage read model's own fragment is
# `./shared/analytics.yaml`: it answers from the Control Plane's own derived
# state, and the fragment is where what it is allowed to say is declared.
openapi: 3.1.0
info:
  title: Ecoma LLM Gateway — Console API
  version: 0.1.0
  description: >-
    The Control Plane's public surface, and the only one of the gateway's
    three contracts a browser reaches. Every response returns X-Request-Id,
    and every failure — including the ones no operation declares, a 404 for
    an unmatched path and a 500 for an unclassifiable implementation failure
    — returns the ErrorEnvelope. A readiness probe taken while the Control
    Plane's own dependencies are not answering returns HTTP 503 and the
    `service_unavailable` code.

    The surface has two halves that meet at the session cookie. The
    **session surface** — sign-in, the current principal, sign-out — is the
    only part reachable without one, and the only part that writes nothing but
    the session itself. The **product surface** is everything else, and every
    operation on it requires a session and authorizes against the account that
    session names.

    The account is never a path segment and never a query parameter the
    caller sets. It comes from the session, always; a resource the session's
    account does not own is a 404 the query did not return, not a 403 a filter
    turned into one. Unsafe methods additionally require a same-origin
    `Origin` and a JSON content type, which no cross-site HTML form can
    produce. Product responses carrying a credential, a balance or a private
    ledger are sent `Cache-Control: no-store`.

    The product schemas this document references live in
    `./shared/console.yaml`, alongside the session types — one fragment rather
    than a second document, because the repository holds exactly three OpenAPI
    documents, one per application (AGENTS.md rule 2).

    Usage is on it. Its scope is derived from the credential on the request
    and never named by the caller, so the rule above about the account never
    being a parameter is a property of the statement rather than a convention
    this surface asks its handlers to remember.
servers:
  - url: /
tags:
  - name: probes
    description: >-
      Process probes. All three applications in this repository serve the same
      trio, and each document declares its own copy of the tag because each
      document is read on its own; the tag is where a reader sees that they are
      one convention rather than three unrelated endpoints.
  - name: session
    description: >-
      The session surface. Sign-in, the current principal and sign-out — the
      three operations reachable without a session, and the only three that
      do. Sign-in is the sole unauthenticated write on this surface: it
      creates the session cookie every other operation requires.
  - name: account
    description: >-
      The session's own account: its dashboard, its plan catalogue, and the
      funding buckets its money lives in. Every operation is scoped to the
      session's account server-side.
  - name: identity
    description: >-
      Who can act for the account: its console users and its API keys. The
      credential an API key is minted with is returned exactly once, at mint.
  - name: commerce
    description: >-
      What the account has bought: plans and their versions, subscriptions,
      and the entitlements each subscription cycle materialised. Read-only in
      this change; the roll that creates entitlements is a worker, and a
      console that could write a subscription would be a second place where
      one is created.
  - name: accounting
    description: >-
      Where the account's money is: its funding buckets with their three
      cached balances, and one bucket's ledger. Balances are rendered, never
      derived by the client; a correction to an append-only ledger is an
      operator's act and there is no operation for one here.
  - name: reconciliation
    description: >-
      The divergences the reconciliation worker found and the passes it made.
      Read-only: acknowledging a finding records an operator's decision, and
      that write is a separate change with its own contract. A finding is
      evidence, not a repair path, and nothing on this surface refunds anyone.
  - name: usage
    description: >-
      The account's usage read model — derived figures over a bounded range, at
      a declared grain. Its own fragment is `./shared/analytics.yaml`, and the
      tag carries the convention every product operation here follows: the
      scope of an answer is derived from the caller on the server, the request
      names no scope of its own, and every figure is reconstructable from state
      this plane already holds. Nothing served here is an authority — the
      ledger remains the money record, and a usage figure that disagreed with
      it would be the figure that is wrong.

      Deliberately absent, and named so their absence reads as a decision
      rather than an oversight: attempts, latency, per-model and per-provider
      spend, routing outcomes, egress and token counts. Those are the Data
      Plane's facts, no cross-plane read path to them exists yet, and a figure
      this surface cannot source honestly is one it does not serve.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - probes
      summary: Liveness of the Control Plane API process
      description: >-
        Returns 200 while the process is able to serve. Anything more than
        "is the process alive" belongs to /readyz, not here.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - probes
      summary: Readiness of the Control Plane API service
      description: >-
        Returns 200 when the service may receive traffic, and 503 while one of
        the Control Plane's own dependencies is not answering — its database,
        and only its database. The Data Plane is never among them: this
        service is ready when it can serve the console, whether or not the
        runtime is reachable.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The service is ready to receive traffic.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/HealthStatus"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/errors.yaml#/components/responses/ServiceUnavailable"

  /version:
    get:
      operationId: getVersion
      tags:
        - probes
      summary: Build version of the Control Plane API service
      description: >-
        Returns the version stamped into the console-api binary at build time.
        It is the repository release version when the release lane supplies
        one, and "dev" for an unstamped local build.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The build version of the Control Plane API service.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/probes.yaml#/components/schemas/Version"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # The session surface.
  #
  # Three operations, and the third is the only one reachable without a
  # session. They sit at fixed paths with no account in them, because the
  # account comes from the cookie these three establish.
  # ---------------------------------------------------------------------------

  /auth/sign-in:
    post:
      operationId: signIn
      tags:
        - session
      summary: Exchange an account id, an email and a credential for a session
      description: >-
        The only unauthenticated write on this surface, and the only way a
        session comes into existence. On success it returns a principal in the
        body and sets the session cookie in the header — the credential is in
        the `Set-Cookie` and in nothing else, because a JSON body cannot set a
        cookie.

        Resolution is `(account_id, email)` over live rows, and never email
        alone: the address can be live in two accounts, so an email-only
        lookup is a guess between two live identities (ADR 0008 §1). An
        `invited` row resolves to exactly one user and **authenticates
        nobody** — the activation is what establishes that the human who now
        holds the address is the human the invitation named, and an invited
        row has not had one (ADR 0012 §2, amending ADR 0008).

        Every failure — no such account, no such user, a removed user, a
        wrong credential, an `invited` row — returns the **same** 401 with the
        **same** body. They are not distinguished, by status, by code, by
        message, or by wall time: a difference is a disclosure to anyone
        willing to submit guesses, and the one answer keeps the account's own
        existence off the wire. The account's lifecycle verdict is made after
        the credential matches, and says `suspended` or `closed` distinctly —
        authentication before authorisation, the same step order the API-key
        path uses.

        The request body is never logged, at any level, on any path. A
        sign-in that failed still costs the credential comparison, and the
        comparison is constant-time, so the wall time of a rejection does not
        answer whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./shared/console.yaml#/components/schemas/SignInRequest"
      responses:
        "200":
          description: >-
            The credential matched. The session cookie is set; the body
            carries who the session belongs to and nothing else.
          headers:
            Set-Cookie:
              $ref: "./shared/console.yaml#/components/headers/SessionCookie"
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/SignInResponse"
        "400":
          description: >-
            The request is well-formed HTTP and its inputs do not satisfy the
            contract — an address that is not plausible, an account id that is
            not a UUID, a field that is missing or too long. The message names
            the offending field and never whether the account exists: a
            credential that has not been checked cannot be the thing the
            answer is about.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          description: >-
            The credential did not match, or the identity it would authenticate
            is not in a state that may authenticate. One answer for every
            cause, deliberately.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The credential matched and the account it belongs to is suspended
            or closed. It is a **403** and not a 401 because the caller has
            proved who they are; what it learns is about their own account,
            which they are entitled to know.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "415":
          description: >-
            The request did not arrive as `application/json`. This operation
            accepts no other encoding, and a form post — the one thing a
            hostile page can make a browser send cross-origin without a
            preflight — is refused here rather than parsed.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /auth/session:
    get:
      operationId: getSession
      tags:
        - session
      summary: The principal this session belongs to
      description: >-
        What the console calls on every load, before it renders anything, to
        know whether to show a signed-in shell or a sign-in form. It reads the
        cookie, resolves the session row, and answers with the principal — no
        account data, no balances, nothing an unauthenticated caller could
        enumerate by asking.

        A 200 here is the only proof of authentication the client ever has,
        and the client treats it as one: the browser is not a security
        boundary, and every product operation re-checks the session
        server-side regardless of what this said.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The session is live and names this principal.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/Principal"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
    delete:
      operationId: signOut
      tags:
        - session
      summary: End this session
      description: >-
        Ends the session the cookie names and clears the cookie. It is
        **idempotent**: signing out twice is not an error, and signing out
        with no session is not an error either. A sign-out that failed would
        leave a session alive on a machine the user believes they signed out
        of, so the second call answers 204 whether or not there was anything
        to end — and a caller who cares can read the cookie's absence as the
        answer.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "204":
          description: >-
            There is no session, and there is now certainly not one. The cookie
            is cleared either way.
          headers:
            Set-Cookie:
              $ref: "./shared/console.yaml#/components/headers/SessionCookie"
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
        "403":
          $ref: "./shared/console.yaml#/components/responses/CrossOriginRequest"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "415":
          $ref: "./shared/console.yaml#/components/responses/NonJSONRequest"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # The dashboard: one composition, server-side.
  # ---------------------------------------------------------------------------

  /account/overview:
    get:
      operationId: getAccountOverview
      tags:
        - account
      summary: The session's account, composed for the dashboard
      description: >-
        The BFF composition ADR 0012 §1 settles, in its first form: figures
        that live in three bounded contexts, assembled **server-side** into
        one operation with one account scope. It exists because the dashboard
        needs all three and a client that composed them would be doing three
        round trips to reimplement a join — and a client that computed a
        figure from three responses would be doing the plane's arithmetic in
        the browser, where a disagreement has no authority behind it.

        The composition is a use case in `internal/application`, not a new
        layer, and the operation is declared here so the contract and the
        implementation are the same review.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      responses:
        "200":
          description: The composed overview.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/AccountOverview"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Identity: users and API keys.
  # ---------------------------------------------------------------------------

  /users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: The account's console users
      description: >-
        The account's live users, keyset-paginated. A page carries no total —
        see `./shared/console.yaml` on why — so a console renders "more" from
        `has_more` and never a count it did not get. The `state` filter is
        optional; omitting it returns invited and active together, which is
        what a member list is, while the schema keeps `removed` reachable for
        an operator who is auditing an address that was retired.

        The list is the account's users and **only** the account's. The
        account comes from the session, and the query carries the predicate
        with it — not as a filter applied afterwards, but as a `WHERE` clause,
        so another account's row is a row the query never returned.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - name: state
          in: query
          required: false
          description: >-
            Restrict to one lifecycle state. Omit for every live user.
          schema:
            type: string
            enum:
              - invited
              - active
              - removed
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of the account's users.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/UserPage"
        "400":
          description: >-
            A parameter does not satisfy the contract — a `limit` outside its
            bounds, a cursor this surface cannot place, or a cursor carrying a
            filter the request no longer makes. Refused rather than served
            against the new filter.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /api-keys:
    get:
      operationId: listAPIKeys
      tags:
        - identity
      summary: The account's API keys
      description: >-
        The account's keys, keyset-paginated, newest last. Every key here is
        an **ownership record**: no plaintext, no digest. The credential a key
        was minted with is not in this table, was never stored in it, and is
        not recoverable from it — the one time it exists is the mint's
        response.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of the account's keys.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/APIKeyPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
    post:
      operationId: mintAPIKey
      tags:
        - identity
      summary: Mint an API key, and return its credential exactly once
      description: >-
        Creates a key's ownership record and returns its credential — the only
        time the plaintext exists anywhere. It is not persisted, not
        derivable from anything else in the response, and not recoverable by
        any later call: losing it means minting another key, which is the
        intended cost of losing it.

        The mint takes **no idempotency key**, and that is the design rather
        than an omission. A replay of this request must mint a second key
        rather than return the first's credential again, because returning it
        again would make "shown once" a property of the client rather than of
        the system — a double-clicked button is a second key, and an operator
        with two keys can revoke one. The alternative, an idempotency key
        whose replay returns the original plaintext, would keep the secret
        recoverable for as long as the key record lived, which is precisely
        what minting it once is meant to prevent.

        It is the one write on this surface that produces a secret, and it
        carries the same guards every unsafe method does: a same-origin
        `Origin`, a JSON content type, and a session whose account is the one
        the key would belong to. The creator is the session's own user, and
        the query's account predicate is what stops a key landing under an
        account the caller did not name — because there is no account to
        name.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./shared/console.yaml#/components/schemas/MintAPIKeyRequest"
      responses:
        "201":
          description: >-
            The key and its credential. The `token` field is the plaintext,
            and this is the only response that will ever carry it.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/MintedAPIKey"
        "400":
          description: >-
            The body does not satisfy the contract — a missing or blank
            display name, or a content type this operation does not parse.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./shared/console.yaml#/components/responses/CrossOriginRequest"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "415":
          $ref: "./shared/console.yaml#/components/responses/NonJSONRequest"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Commerce: what the account bought.
  # ---------------------------------------------------------------------------

  /plans:
    get:
      operationId: listPlans
      tags:
        - commerce
      summary: The plan catalogue
      description: >-
        Every plan the Control Plane offers, with its versions. A plan is not
        account-scoped — it is the catalogue every account buys from — so this
        operation returns the whole thing and pages it, rather than returning
        "the plans this account uses", which is a different question answered
        by the subscriptions list.

        Read-only. Publishing, retiring and adding a grant definition are
        commercial acts with their own review, and a console that could
        publish a plan would be a second place a price becomes real.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of plans.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/PlanPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags:
        - commerce
      summary: The account's subscriptions
      description: >-
        The account's subscriptions, keyset-paginated. A subscription's state
        and its `cancel_at` are separate on purpose: a scheduled cancellation
        is **data, not a state** — the subscription stays `active` and usable
        until that instant passes — so a console that rendered "cancelled" for
        a row carrying a future `cancel_at` would be describing a decision
        that has not taken effect yet, and one that renders the two
        separately is telling the operator the truth about both.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of the account's subscriptions.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/SubscriptionPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /entitlements:
    get:
      operationId: listEntitlements
      tags:
        - commerce
      summary: The entitlements the account's subscriptions materialised
      description: >-
        One row per (subscription, cycle, grant definition) triple the roll
        has produced. An entitlement is a **grant**, not a balance: what
        remains of it is drawn on a funding bucket, and this surface has a
        separate operation for those. A console that showed "remaining" here
        would be showing nothing — there is no such column, deliberately,
        because a third copy of the same number with no rebuild story is how
        two consoles start disagreeing about what a customer bought.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of entitlements.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/EntitlementPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Accounting: where the money is.
  # ---------------------------------------------------------------------------

  /funding-buckets:
    get:
      operationId: listFundingBuckets
      tags:
        - accounting
      summary: The account's funding buckets, with their three balances
      description: >-
        Every bucket the account owns — its entitlement cycles and its PAYG
        balance — each with the three cached balances the domain defines
        (`settled`, `held`, `available`). The console **renders** them and
        never derives one from the others: a client computing `available` as
        `settled − held` would be doing the ledger's algebra in the browser,
        and a disagreement between the two would have no authority behind it.
        They are a projection, and if the cache and the legs ever disagree the
        legs win.

        The two bucket kinds are told apart by `kind`, because they behave
        differently: an entitlement bucket's lifetime is its cycle's and it
        closes when the cycle ends, while an account bucket is the PAYG
        balance and does not roll. A list that merged them would render two
        sets of figures with incompatible meanings side by side.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of the account's buckets.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/FundingBucketPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /funding-buckets/{funding_bucket_id}/ledger:
    get:
      operationId: listLedgerEntries
      tags:
        - accounting
      summary: One bucket's ledger, oldest first
      description: >-
        The legs of **one** bucket, in its own sequence order. This is the
        only operation on the surface that names a resource in its path, and
        the id it names is a bucket — a bucket the session's account does not
        own is a 404 the query did not return, exactly as if it did not
        exist.

        The path is per bucket rather than "all legs" because a ledger is a
        fact about where money went, and a merged list of every bucket's legs
        would be a question about money this plane has no index to answer.
        The sequence is the keyset: it is allocated by the store inside the
        transaction that writes each leg, it is strictly increasing per
        bucket, and a page keyed on it can neither skip a leg nor read one
        twice. The `direction` filter exists because operators read a ledger
        for two different questions — what came in, and what went out — and
        the two are not the same read.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - name: funding_bucket_id
          in: path
          required: true
          description: The bucket whose history is wanted.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          description: >-
            Restrict to one leg kind — `consume` for spend, `topup` or
            `grant` for funding, `hold` and `release` for the reservation
            cycle. Omit for the whole history.
          schema:
            type: string
            enum:
              - grant
              - topup
              - hold
              - release
              - consume
              - adjustment
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of the bucket's legs, oldest first.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/LedgerEntryPage"
        "400":
          description: >-
            A parameter does not satisfy the contract — a `kind` outside the
            enum, a `limit` outside its bounds, or a cursor carrying a filter
            the request no longer makes.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Reconciliation: what the worker found.
  # ---------------------------------------------------------------------------

  /reconciliation/findings:
    get:
      operationId: listFindings
      tags:
        - reconciliation
      summary: The divergences the worker has recorded
      description: >-
        The recorded findings, newest first, with the `observed` evidence each
        one compared. The evidence is rendered as text and **never
        interpreted** — it is structured JSON written by the check that found
        the divergence, its shape is that check's business, and a client that
        summed or re-aggregated it would be producing a figure no check
        asserted.

        Read-only, and the reason is not conservatism: a finding is evidence,
        not a repair path. Acknowledging one records an operator's decision
        and is a separate write with its own contract. Nothing here refunds
        anybody, and a correction to an append-only ledger is a **new
        adjustment leg** naming the entry it corrects — an operator's act with
        an `operator_id` on it, never a button on a findings table.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - name: status
          in: query
          required: false
          description: >-
            Restrict to one status. Omit for every finding, open and closed.
          schema:
            type: string
            enum:
              - open
              - acknowledged
              - resolved
        - name: severity
          in: query
          required: false
          description: Restrict to one severity.
          schema:
            type: string
            enum:
              - info
              - warning
              - critical
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of findings.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/FindingPage"
        "400":
          description: A filter or pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /reconciliation/runs:
    get:
      operationId: listReconciliationRuns
      tags:
        - reconciliation
      summary: The passes the worker has made
      description: >-
        The run history, newest first. A run whose `finished_at` is null is a
        pass that started and never finished — a fact worth rendering rather
        than hiding, because a wedged worker and an idle one are otherwise
        indistinguishable. The half-open window is returned as its two halves
        because a window rendered as an inclusive pair is one an operator
        cannot tell from one that overlapped the last.
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - $ref: "./shared/console.yaml#/components/parameters/PageAfter"
        - $ref: "./shared/console.yaml#/components/parameters/PageLimit"
      responses:
        "200":
          description: One page of runs, newest first.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/console.yaml#/components/schemas/ReconciliationRunPage"
        "400":
          description: A pagination parameter does not satisfy the contract.
          headers:
            X-Request-Id:
              $ref: "./shared/console.yaml#/components/headers/RequestID"
            Cache-Control:
              $ref: "./shared/console.yaml#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "./shared/errors.yaml#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "./shared/console.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"

  /usage:
    get:
      operationId: getUsage
      tags:
        - usage
      summary: The caller's account usage over a range
      description: >-
        Returns one account's usage figures over a half-open range
        `[from, to)`, cut into buckets of the requested granularity.

        SCOPE IS DERIVED, NEVER REQUESTED. There is no account parameter on
        this operation and no other way for a caller to name the account
        these figures are about. The scope comes from the credential on the
        request, resolved on the server, and it is applied inside the
        statement that produces the numbers rather than after it. A caller
        therefore has nothing to tamper with: there is no filter on the
        request to tamper with, and a caller that presents a scope it was
        not granted is refused rather than silently answered for its own.

        WHAT THIS SERVES, AND WHAT IT DELIBERATELY DOES NOT. Every figure is
        derived from the Control Plane's own state — the settlement headers
        of record, the usage-fact ledger, and the accounting projection's
        cached balances — and every one of them is reconstructable from that
        state. None is an authority, and the ledger remains the money record:
        a usage figure and the ledger disagreeing is a defect in the figure.

        THE POPULATION IS NAMED, NOT ASSUMED. This plane cannot derive the
        requests the runtime ADMITTED: a request that produced no usage fact
        leaves no row here at all, so any "requests admitted" figure it
        published would measure the set of requests it knows about and call
        it the set of requests. The counts here are therefore named for what
        they count — `requests_with_usage_facts` — and the absence of the
        operational metrics below is the same finding seen from the other
        side.

        Requests, latency, attempts, per-model and per-provider spend, routing
        outcomes, egress and token counts are NOT served, and their absence
        is a decision rather than a gap. They are the Data Plane's facts, no
        cross-plane read path to them exists, and a figure this surface
        cannot source honestly is one it will not serve — not at zero, which
        would be a false statement about a customer, and not as an empty
        series, which would render as a quiet month.

        NOTHING HERE IS CLOSED. No period is closed anywhere in this system:
        no accounting period, no close, no lock. A late usage fact lands in
        the bucket it lands in and changes a figure that was already
        reported, so a range ending near `freshness.data_through` is
        provisional, and `final_bucket_partial` says so structurally. Read
        the freshness object before treating any of this as a bill.

        SERVED AT `/usage`, like every product operation here: this document's
        server base is `/`, so the path a caller calls is the path declared
        above. The runtime's namespace prefix is `/v1/` and nothing on this
        surface is served under it (ADR 0006 §5).

        BOUNDS ARE REFUSALS. A range longer than 90 days, a `from` at or
        after `to`, a granularity outside the enumeration, or an unknown
        query parameter is HTTP 400 with `invalid_request`. Nothing is
        clamped: a silently shortened range is indistinguishable from the
        range that was asked for, and a caller could not learn of the
        mismatch anywhere.

        The answer is subject to a per-request deadline. A caller that
        exceeds it receives HTTP 503 with `service_unavailable`, which is a
        retry-later answer rather than a differently-shaped one.
      security:
        - consoleCredential: []
      parameters:
        - $ref: "./shared/probes.yaml#/components/parameters/RequestId"
        - name: from
          in: query
          required: true
          description: >-
            The inclusive lower bound of the range, as an absolute instant in
            RFC 3339. Required rather than defaulted: a range that defaults
            to "the last thirty days" answers a question nobody asked, and a
            caller cannot tell a default from a choice.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: >-
            The EXCLUSIVE upper bound of the range, as an absolute instant in
            RFC 3339. Half-open with `from`, so two consecutive ranges tile
            the timeline with neither overlap nor gap.
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          required: true
          description: >-
            The width of one point in the series. A closed enumeration, and
            the request may name nothing outside it. There is deliberately
            no `group_by`: the dimensions a caller may slice by are the ones
            this surface writes a query for, and a caller that named a
            column would be naming the schema.
          schema:
            type: string
            enum:
              - hour
              - day
              - calendar_month
        - name: timezone
          in: query
          required: false
          description: >-
            The IANA zone to cut the buckets in. Optional, and defaults to
            UTC, which is also where every figure is stored. A local zone
            changes where the bucket EDGES fall and nothing else: the
            monetary figures are UTC instants summed either way. A zone that
            cannot be resolved is HTTP 400, never a silent fallback to UTC —
            a chart in the wrong zone is wrong in a way no figure defends.
          schema:
            type: string
            maxLength: 64
            default: UTC
      responses:
        "200":
          description: >-
            The account's usage over the range. A range this plane holds no
            derivation for is a 200 with `availability: not_available` and an
            empty series — an answer, not a failure, and distinct from a
            range that is simply quiet.
          headers:
            X-Request-Id:
              $ref: "./shared/probes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./shared/analytics.yaml#/components/schemas/AnalyticsUsageResponse"
        "400":
          $ref: "./shared/errors.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "./shared/errors.yaml#/components/responses/Unauthenticated"
        "404":
          $ref: "./shared/errors.yaml#/components/responses/NotFound"
        "405":
          $ref: "./shared/errors.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "./shared/errors.yaml#/components/responses/InternalError"
        "503":
          $ref: "./shared/errors.yaml#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    consoleCredential:
      type: http
      scheme: bearer
      description: >-
        A credential presented by a caller of the Control Plane's public
        surface. It is the one scheme here that is not a browser session: the
        operations beside this one identify their caller by the session
        cookie, and this is for a caller that has none — a script, a scheduled
        report, an operator's tooling.

        The deployment supplies the credential and the resolution is the
        server's: the account this surface answers about is derived from the
        credential and is never named by the request. A credential that does
        not resolve is HTTP 401 with `unauthenticated`; it is not silently
        answered for a default
        account, because a caller that cannot tell it was refused is a
        caller that will draw a chart of someone else's spend.

        The transport is expected to be replaced by one that proves the
        identity cryptographically (mTLS or a signed credential) without
        changing this contract, and a browser session is not this scheme: a
        session is a different credential with a different lifetime and a
        different revocation story, and modelling it here before it exists
        would be a promise this document cannot keep.
