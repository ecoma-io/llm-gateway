# The error shape the Data Plane's OpenAI-compatible runtime returns, and the
# two channels it uses.
#
# This is a fragment like its siblings — a `components:` tree `runtime.yaml`
# references by relative path — and it is deliberately separate from
# `errors.yaml`. The runtime's caller is an OpenAI-compatible client that this
# repository does not get to re-teach: it was written against `error.type` and
# `error.message`, and it will keep parsing those whatever the gateway's own
# surfaces do. Sharing one envelope across all three contracts was convenient
# for the gateway and wrong for that caller, which is why the two error
# vocabularies now move independently (ADR 0006 §11).
#
# There are two channels, because a runtime request can fail on either side of
# one irreversible moment — the first content-bearing byte written to the
# client:
#
#   - **Before commitment.** Nothing has been sent to the client yet, so the
#     failure is ordinary HTTP: a status code and this JSON body. A candidate
#     that failed here may still be followed by another (ADR 0002): the
#     runtime's fallback is a pre-commitment behaviour, and a caller sees at
#     most one error even when several candidates failed behind it.
#   - **After commitment.** A status line and a body have already gone out, so
#     no HTTP status can be revised. The failure is written as a Server-Sent
#     Event `data:` frame carrying this same JSON body, followed by the
#     terminal `data: [DONE]` frame, and then the stream closes. A client that
#     has already rendered content is told the stream ended in failure instead
#     of being left to time out.
#
# A third case writes nothing at all: the client disconnected. There is no
# channel left to report on, so the observation belongs to the runtime's usage
# facts, not to the wire — see docs/architecture/request-lifecycle.md.
#
# The framing itself is behaviour rather than shape, so the byte layout is
# stated in runtime.yaml's operation description and pinned by a test in
# apps/dataplane rather than modelled as a schema here.
components:
  headers:
    RetryAfterHint:
      description: >-
        The runtime's hint, in seconds, of how long a caller should wait
        before retrying. It is advice about a condition expected to clear, not
        a rate-limit sentence: a `request_in_progress` answer carries a short
        hint because the original request is already being processed, and a
        no-candidate answer carries a longer one because capacity and routes
        change on their own.
      required: false
      schema:
        type: string
        example: "1"
    IdempotentReplay:
      description: >-
        Present, with the value "true", when this response is a replay: the
        same `Idempotency-Key` and the same request body as a request the
        runtime has already decided, answered again from that decision rather
        than executed a second time. The body is byte-for-byte the answer the
        original request received.
      required: false
      schema:
        type: string
        enum:
          - "true"
    OriginalRequestId:
      description: >-
        The runtime's own identifier for the request whose decision this
        replay re-answers — the identity the runtime's usage facts and
        reservations carry. It is not the caller's X-Request-Id, which stays
        the correlation handle for this attempt alone.
      required: false
      schema:
        type: string
  responses:
    MethodNotAllowed:
      description: The resource exists but does not accept the request method.
      headers:
        Allow:
          description: The methods supported by this resource.
          required: true
          schema:
            type: string
            example: GET, HEAD
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    NotFound:
      description: >-
        No operation is declared at the requested path. The runtime answers
        every unmatched path this way rather than letting its router emit an
        HTML or plain-text page, so a client parses one shape for every failure
        this surface can produce.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    InternalError:
      description: >-
        The runtime failed in a way it cannot classify. The internal cause is
        logged against the request identifier and never serialized. One
        classified case shares this answer on the chat-completion operation:
        code `upstream_authentication`, when the upstream refused the
        gateway's credentials — an operator problem, logged loudly and never
        carrying credential material in the body. On that operation the answer
        is a recorded ending, replayed byte-for-byte on a repeat of the same
        key and body; the probes never replay and never carry the replay
        headers.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    ServiceUnavailable:
      description: >-
        The runtime is up and not ready: one of its own dependencies is not
        answering yet — its database unreachable, or its credential projection
        not yet bootstrapped, meaning no snapshot has been applied and there is
        no mirror to admit a request against (ADR 0007). The condition is
        expected to clear, so a caller retries later rather than differently:
        the type is `overloaded_error` and there is no code.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    BadRequest:
      description: >-
        The request was refused 400 in one of two situations. Admission
        refused it before spending anything: a missing or malformed `model`
        (including a value outside the model grammar), a missing, non-positive,
        disagreeing, or past-the-2147483647-bound output ceiling, a missing or
        malformed `Idempotency-Key`, a body that cannot be parsed, or a body
        larger than the 10485760-byte bound the operation declares — an
        oversized body is refused 400 and never 413, because the runtime
        declines to admit it rather than declining to carry it. The `param`
        names the field at fault when there is one, and no code is attached.
        Or the request was admitted and served by a candidate whose upstream
        refused it before any content was sent: `provider_rejected_request`
        when the upstream rejected the forwarded request (the client's request
        is the one at fault — the same request against another candidate would
        fail identically, so nothing is retried behind the answer), and
        `context_too_large` when the request's context exceeds what the
        upstream accepts (surfacing it beats silently truncating it). In that
        second situation the reservation was released unused and the answer
        names the refusal in `code`. A refusal recorded in the idempotency
        store is replayed on a repeat of the same key and body, with the two
        replay headers beside it.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    Unauthorized:
      description: >-
        The request presented no credential the runtime could verify: no
        Authorization header, more than one, something other than a bearer
        credential, a credential outside the key grammar, a key the mirror
        does not hold, or a key that has been revoked. Every one of these
        causes is answered with the same message and the same
        `invalid_api_key` code — the answer never says which part of
        verification failed, because a differential answer is a probe. No
        request is recorded, so a retry with a good key is a first attempt,
        never a replay.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    Forbidden:
      description: >-
        The caller is known and the refusal is an account decision, not a
        verification failure. The code names the decision: `account_suspended`
        while the owning account is suspended, `account_closed` once it is
        closed, and `no_access` when the account holds no entitlement to the
        requested model and no pay-as-you-go balance at all. A recorded
        refusal is replayed on a repeat of the same key and body, with the two
        replay headers beside it.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    ModelNotFound:
      description: >-
        The `model` the request names is not an alias this runtime serves. The
        runtime distinguishes this from a 400 on purpose: a client that
        resolves a model name before using it branches on the code, and
        `model_not_found` with `param` "model" is the OpenAI-compatible
        spelling of that branch. A recorded refusal is replayed on a repeat of
        the same key and body, with the two replay headers beside it.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    Conflict:
      description: >-
        The request was not admitted because of its `Idempotency-Key`, under
        one of two codes. `idempotency_conflict`: the key was already stored
        with a different body, so the runtime refuses rather than guessing
        which request the caller meant — the caller retries with a fresh key
        and never with the same one, so there is no Retry-After.
        `request_in_progress`: a request with this key and body is still being
        processed, and the caller retries the same request with the same key
        once it completes — the answer carries a short `Retry-After` hint
        saying so.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfterHint"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    InsufficientQuota:
      description: >-
        The caller's entitlements and pay-as-you-go balance were matched, and
        every match came up short of the spend the request implies, so nothing
        was reserved and no upstream was contacted. The `type` is
        `insufficient_quota` — the class an OpenAI-compatible client already
        treats as capacity, not correctness — and the code says the same, so
        the client's retry decision is its own: back off, or come back with a
        smaller request. A recorded refusal is replayed on a repeat of the
        same key and body, with the two replay headers beside it.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
    NoCandidate:
      description: >-
        The request was admitted — the hold it implied was reserved — and the
        runtime could not route it, so the reservation was released unused,
        under one of two conditions the answer does not distinguish. No
        candidate matched the request: the alias carries none whose backend is
        active and servable. Or candidates matched and every one of them
        failed before the answer was committed: the runtime fell through the
        whole list and reports that nothing served it, never the failure of
        the last candidate alone. Either way the condition is expected to
        clear as capacity and routes change, which is why the type is
        `overloaded_error` and the answer carries a `Retry-After`: the caller
        retries later rather than differently. A recorded answer of either
        condition is replayed on a repeat of the same key and body, with the
        two replay headers beside it and the `Retry-After` hint still
        attached.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
        Idempotent-Replay:
          $ref: "#/components/headers/IdempotentReplay"
        X-Original-Request-Id:
          $ref: "#/components/headers/OriginalRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfterHint"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
  schemas:
    RuntimeError:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/RuntimeErrorBody"
      additionalProperties: false
      description: >-
        The body of an HTTP error from the runtime, and the body carried by a
        `data:` frame when a committed stream fails.
    RuntimeErrorBody:
      type: object
      required:
        - message
        - type
      properties:
        message:
          type: string
          description: >-
            A human-readable explanation safe to present to a client. Internal
            causes, provider payloads and stack traces never appear here.
        type:
          type: string
          enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - not_found_error
            - rate_limit_error
            - api_error
            - overloaded_error
            - insufficient_quota
          description: >-
            The caller-facing failure class, in the vocabulary an
            OpenAI-compatible client already branches on. The list is the
            compatibility surface: widening it is a change to this document,
            and a class this runtime cannot yet produce is declared only
            because a caller written elsewhere already handles it — the
            gateway must not answer `api_error` for a condition the caller
            would have retried had it been named correctly. `insufficient_quota`
            is the declared-this-generation member: the runtime matches
            entitlements and balance and comes up short, and a client written
            against the OpenAI API treats that class as capacity rather than
            correctness.
        param:
          type: [string, "null"]
          description: >-
            The parameter the failure concerns, when the failure is about one.
            Null otherwise.
        code:
          type: [string, "null"]
          description: >-
            An optional machine-readable refinement of `type`, for the cases
            this runtime can name precisely. The codes in use are:
            `invalid_api_key` (401, the presented credential could not be
            verified — one answer for every cause, so the answer is not a
            probe); `account_suspended`, `account_closed` and `no_access`
            (403, the account decision that refused a known caller);
            `model_not_found` (404, the requested alias does not exist — the
            one code a client resolves a name by); `invalid_request` (400,
            with `param` naming the field at fault);
            `idempotency_conflict` and `request_in_progress` (409, the two
            ways an idempotency key refuses a request);
            `insufficient_quota` (429, capacity matched and short);
            `provider_rejected_request` and `context_too_large` (400, the
            upstream refused the admitted request before any content was sent
            — the caller's request is at fault, and the answer names which
            refusal); and `upstream_authentication` (500, the upstream refused
            the gateway's credentials — an operator problem, never naming
            credential material). Null when `type` alone is the whole story.
      additionalProperties: false
