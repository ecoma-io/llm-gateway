# The console's own fragments: the session surface's types, the read
# projections each screen renders, and the pagination every list speaks.
#
# This is a fragment, not a fourth document. `api/openapi/console.yaml`
# references it by relative path exactly as it references `errors.yaml` and
# `probes.yaml` (AGENTS.md rule 2: the repository holds exactly three OpenAPI
# documents, one per application). It is split out of `console.yaml` itself
# because the console's product surface is large and a reader who wants the
# shape of a funding bucket should not scroll past the session's cookie
# attributes to find it — and because the three documents stay independently
# readable, which is the property the split is for.
#
# Two rules run through every schema here, and both are the repository's
# rather than the console's:
#
#   - **No total, ever.** No list operation here declares one. A total over a
#     table this plane is still growing is a number that is wrong the instant
#     it is written, and an operator who reads it is reading a count nobody
#     recomputed. `has_more` and `next_cursor` are the whole of what a page
#     says about what follows it; a row count is what a list screen can do
#     without. The Data Plane's own `Page` says the same about the facts it
#     serves (`shared/usage-facts.yaml`).
#
#   - **An account is never a path segment.** No path below takes
#     `/accounts/{account_id}/…`, and no query parameter takes an account id
#     the caller could set to somebody else's. The account comes from the
#     session cookie and from nowhere else. The reason is not style: a path
#     segment is written into every proxy's access log, every `Referer` header
#     on every outbound navigation, and every browser history entry, so an
#     account-scoped path records which customer each operator was reading in
#     a place none of them chose to put it. A resource the session's account
#     does not own is therefore a 404 the query simply did not return, never a
#     403 a filter turned into one.
components:
  parameters:
    PageAfter:
      name: after
      in: query
      required: false
      description: >-
        An opaque cursor naming the position after which rows are wanted.
        Omit it to begin at the first row. The value is never interpreted by
        the caller and never by the console: pass back the `next_cursor` of
        the previous page, or nothing. A cursor carrying a filter the request
        no longer makes is refused with `400 invalid_request` rather than
        served against the new filter, because a page reached through a
        mismatched cursor is a page whose rows belong to a question the caller
        is no longer asking.

        An empty page's `next_cursor` names the position the page was REQUESTED
        FROM, so paging past the end holds the walk where it is rather than
        restarting it: a client that pages once more gets the same empty page
        and `has_more: false`, and an empty position — the one before the first
        row — is only ever named by the FIRST page of a walk that is empty from
        the start.
      schema:
        $ref: "#/components/schemas/Cursor"
    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        The largest number of rows to return. A page shorter than this does
        not mean the collection is exhausted — `has_more` says that, because a
        short page is also what a concurrent write produces.

        The bounds are enforced rather than approximated: a value below
        `minimum`, above `maximum`, or not an integer at all is refused with
        `400 invalid_request`, and a value inside the bounds is served as
        asked. Nothing is clamped. A caller that asked for a larger page than
        this operation will return has asked a question the contract does not
        answer, and the smaller page it would otherwise get is one it cannot
        tell apart from a page this collection capped itself.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  headers:
    SessionCookie:
      description: >-
        The session cookie, set on sign-in and cleared on sign-out. It is
        `HttpOnly`, `Secure` and `SameSite=Strict`, scoped to `Path=/`, and
        carries no credential material in a form the page can read: the
        browser's script never sees the value, so a cross-site scripting bug
        in any dependency exfiltrates nothing. The value is an opaque
        256-bit identifier; the session row it names stores only its SHA-256
        digest, so a database disclosure alone does not yield a usable
        cookie. The `Secure` attribute means the cookie is not sent over
        plaintext HTTP at all, which is why a development deployment behind a
        plain-HTTP proxy cannot sign in — that is the intended failure, not a
        configuration to work around.
      schema:
        type: string
        example: "ses_3f7c1d0e9a5b4c2d8e6f1a0b9c8d7e6f"
    RequestID:
      $ref: "./probes.yaml#/components/headers/RequestId"
    NoStore:
      description: >-
        `Cache-Control: no-store`. Sent on **every** response on this surface
        except the three probes, and the reason is the one-time secret rather
        than a general caution: a minted credential is returned exactly once,
        and a response a browser or a shared proxy was allowed to keep turns
        that once into a durable copy — in a disk cache, in the back-forward
        cache, in a corporate proxy's store, in a support screenshot's
        source. There is no way to revoke a copy nobody told the server
        about, so the response that must not be kept is marked uncacheable at
        the only place that can guarantee it.

        The probes are exempt because they carry no account data and caching
        them is harmless, which is also why they are exempt by enumeration
        rather than by a rule: a reader sees three exempt paths rather than
        having to evaluate a policy. They are also the ONLY exempt responses,
        and the payment provider's webhook is the case worth naming because a
        reader would expect to find it on that list: no browser calls that
        operation, no browser reads its answer, and the answer carries neither
        a secret nor any account's data, so an argument for exempting it can
        be made. The argument loses to a mechanical fact about where the
        answer is written. Every response this surface produces goes through
        one of the same two writers — the JSON writer and the error writer —
        and both set `Cache-Control: no-store` unconditionally, before any
        handler has an opinion about it. That includes the webhook's: the 200
        for a delivery that was recorded or already known, the 400 for one
        that did not authenticate, and the 404 for a provider this deployment
        does not serve. An exemption would therefore be an edit to a writer
        rather than a sentence in a contract, and it would put a per-path hole
        in a rule that is otherwise total — the exempt list is exactly three
        paths long, which is what makes it checkable, and a fourth entry
        invented in prose would be indistinguishable from the exemption
        somebody forgot to remove. The webhook's response blocks declare this
        header for that reason, and not because the provider's servers keep a
        cache.
      schema:
        type: string
        example: no-store

  responses:
    Unauthenticated:
      description: >-
        The request carried no session this service accepts, or the session
        named has ended. Unlike the Data Plane's management surface — which
        rejects a browser session and a customer API key alike because
        neither is a service identity (ADR 0006 §9) — this surface's whole
        caller population is browsers, so `unauthenticated` here means
        exactly what it says: sign in again. The answer is the same whether
        the cookie was absent, expired, revoked, or never existed, and the
        response names nothing about which, because a difference is a
        disclosure to anyone willing to send cookies.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: >-
        The session is valid and identified, and the operation is one this
        principal's class may not perform — the write half of a surface whose
        read half it may. It is deliberately NOT the answer for a resource
        belonging to another account: a cross-account resource is a `404`, the
        same answer a resource that does not exist gives, because a `403`
        there confirms the resource is real to someone who may not have it.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorEnvelope"
    CrossOriginRequest:
      description: >-
        The request's `Origin` is not this surface's own origin, or an unsafe
        method arrived without the double-submit token this surface sets on
        every rendered form. `SameSite=Strict` is the first line of defence
        and this is the second: a cookie is not sent on a cross-site request,
        but a same-site one from a compromised sibling subdomain is, and a
        token the page must echo is something a sibling origin cannot read.
        The status is 403 with the `invalid_request` code — the request is
        well-formed HTTP and is refused for being untrusted, not malformed.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorEnvelope"
    NonJSONRequest:
      description: >-
        An unsafe method arrived with a body the contract does not accept —
        a form encoding, or a content type this surface does not parse. The
        refusal is what makes `SameSite=Strict` load-bearing rather than
        merely cautious: a simple form post crosses origins without a
        preflight and without a custom content type, so a cookie is the only
        thing standing between a form on another site and a money-moving
        write here. Requiring a content type no HTML form can produce is the
        check that removes the ambiguity entirely.
      headers:
        X-Request-Id:
          $ref: "./probes.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorEnvelope"

  schemas:
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        An opaque position in one collection's order. It is safe to store and
        to send back verbatim; it is not safe to interpret, and neither the
        console nor a generated client may decode, compare, order or
        synthesise one. A cursor this surface cannot place — malformed,
        forged, or carrying a filter the request no longer makes — is
        refused with `400 invalid_request`.

    PrincipalClass:
      type: string
      enum:
        - user
        - operator
      description: >-
        What a session's holder is authorised as. There are two classes and
        not three roles: `user` acts for one account and may read its
        identity, commerce and accounting surfaces; `operator` is the
        staff class that administers accounts across accounts. The split is
        two because a three-role model would need a permission matrix this
        product has no use for yet, and a role an operator screen can
        misconfigure is worse than one role it cannot misconfigure. Adding a
        third class later is a new enum member and a new predicate, not a
        migration of this one.

    Principal:
      type: object
      description: >-
        Who the session belongs to. This is what the console renders in its
        header and what every product operation authorizes against; it
        carries no credential, no session token and no secret, and it is the
        only account identifier any product operation consults.
      required:
        - class
        - account_id
      properties:
        class:
          $ref: "#/components/schemas/PrincipalClass"
        account_id:
          type: string
          format: uuid
          description: >-
            The account the session acts for. It is derived from the session
            row, never from the request path or a query parameter.
        user_id:
          type: string
          format: uuid
          description: >-
            The signed-in console identity. Present exactly when `class` is
            `user`.
        operator_id:
          type: string
          description: >-
            The staff identity. Present exactly when `class` is `operator`. A
            text reference rather than a users-row id, because the operator
            surface is not built and the ledger's operator grammar is a
            decision that has not been made
            (`domain/accounting/ids.go:55-58`).
        email:
          type: string
          format: email
          description: >-
            The signed-in identity's address, for display in the console
            header. It is returned because the user is already authenticated
            and it is their own address; it is never a lookup key and never
            appears in a URL.
        session_expires_at:
          type: string
          format: date-time
          description: >-
            When this session stops being accepted. A client that renders a
            countdown from it is reading a fact the server also enforces; the
            value is not a licence to keep calling, because the server's
            check does not consult the client's clock.

    SignInRequest:
      type: object
      description: >-
        The one unauthenticated write this surface accepts. Three inputs, and
        the order they are collected in is the design rather than the form's
        layout: the account's id discriminates, the email resolves within it,
        and the credential is checked against the row that pair names
        (ADR 0008 §2). An "email first, choose the account after" flow would
        have nothing to verify between the two, so its chooser would sit
        before authentication and answer "which accounts does this address
        belong to" to anyone who knows the address.
      required:
        - account_id
        - email
        - password
      properties:
        account_id:
          type: string
          format: uuid
          description: The account's id. It is the only identifier the
            account has, and it is asked for because it is the discriminator
            that makes the email resolution total.
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            The identity's address. Resolution is scoped to
            `(account_id, email)` over live rows, and never to the address
            alone.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: >-
            The identity's credential. It is never stored, never logged, and
            never carried in a URL; the request body is not logged at all, on
            any path, at any level.

    SignInResponse:
      type: object
      description: >-
        The one successful sign-in. It carries the principal and nothing
        else — no token, no secret, nothing a caller could replay to skip the
        cookie. The credential is in a `Set-Cookie` header, and a JSON body
        cannot set one.
      required:
        - principal
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
      additionalProperties: false

    MintAPIKeyRequest:
      type: object
      description: >-
        Mint a key's ownership record. The plaintext is not an input and
        cannot be: it does not exist until this call returns it, which is
        what makes the one-time rendering below a property of the system
        rather than of the console's care.
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            The operator-chosen label shown in the console. Trimmed, and
            bounded in runes so a name's worth does not depend on its script.
      additionalProperties: false

    MintedAPIKey:
      type: object
      description: >-
        A key's ownership record **and** its credential, together, exactly
        once. The `token` field is the only time the plaintext exists
        anywhere outside the mint's return value: it is not persisted
        anywhere, not derivable from anything this response also carries,
        and not recoverable by any later call. Losing it means minting a new
        key, which is the intended cost of losing it.

        Every response carrying this schema — this one and the reads
        below — is sent with `Cache-Control: no-store`, so that a shared
        proxy, a browser's disk cache or the back button does not turn a
        one-time secret into a durable one. The console renders the token
        once, in a field the user must copy, and clears it when that view
        unmounts.
      required:
        - id
        - account_id
        - display_name
        - prefix
        - state
        - created_at
        - token
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        display_name:
          type: string
        prefix:
          type: string
          description: >-
            The public lookup hint baked into every presentation of the
            token: brand plus key id. It is derived from the id, carries no
            secret, and is what a console shows an operator so they can tell
            two of their keys apart.
        state:
          type: string
          enum:
            - active
            - revoked
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        token:
          type: string
          description: >-
            The credential, in full, this once. Never stored, never logged,
            never in a URL, and never re-served.
      additionalProperties: false

    APIKey:
      type: object
      description: >-
        A key's ownership record as every read but the mint returns it. The
        credential is absent, not null: this plane stores no plaintext and no
        digest, and the Data Plane's credential record is written only by the
        Data Plane (ADR 0006 §8).
      required:
        - id
        - account_id
        - display_name
        - prefix
        - state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        created_by:
          type: [string, "null"]
          format: uuid
          description: >-
            The console identity that minted it, or null when minted without
            one.
        display_name:
          type: string
        prefix:
          type: string
        state:
          type: string
          enum:
            - active
            - revoked
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false

    Account:
      type: object
      required:
        - id
        - name
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: >-
            A presentation name. It is not unique, nothing makes it
            immutable, and it is never a key — which is why sign-in asks for
            the account's id and not its name.
        state:
          type: string
          enum:
            - active
            - suspended
            - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    User:
      type: object
      required:
        - id
        - account_id
        - email
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: >-
            The address, normalised to lowercase. It is unique per account
            across live rows, so a removed user's address may be invited
            again; a console that filtered on it across accounts would be
            leaking membership of an account the reader may not be in.
        state:
          type: string
          enum:
            - invited
            - active
            - removed
          description: >-
            `invited` is a live state with no credential behind it: an
            invited row resolves to exactly one user and authenticates
            nobody, because the activation is what establishes that the human
            who now holds the address is the human the invitation named
            (ADR 0012 §2, amending ADR 0008).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    Money:
      type: object
      description: >-
        An amount in minor units with **no currency field**, because the
        ledger stores money as int64 minor units and the currency of an
        account's buckets is a decision the contract has not yet made
        (#63). This is stated on the schema rather than left for a client to
        discover: a number rendered without a unit is worse than a number that
        refuses to render, and a client that guesses a currency here will
        guess it wrong.
      required:
        - minor_units
      properties:
        minor_units:
          type: integer
          format: int64
          description: >-
            The amount. Sign is meaningful on a `delta` and never on a
            balance: a balance is what the bucket holds, and this plane
            refuses to store a negative one.
      additionalProperties: false

    Balances:
      type: object
      description: >-
        A bucket's three cached balances, exactly as
        `domain/accounting/bucket.go` states them:

            settled   = Σ grants/topups − Σ consumes + Σ adjustment settled_deltas
            held      = Σ holds − Σ releases − Σ consumes + Σ adjustment held_deltas
            available = settled − held

        They are returned as three separate figures rather than one
        "balance", because they answer three different questions and an
        operator who is shown a single number is shown a number that answers
        none of them. They are a **projection**: the console renders them and
        never derives one, because a client that computed `available` from the
        others would be doing the ledger's algebra in the browser, and a
        disagreement between the two would have no authority behind it. If the
        cache and the legs ever disagree, the legs win
        (`Reconcile`'s standing rule).
      required:
        - settled
        - held
        - available
      properties:
        settled:
          $ref: "#/components/schemas/Money"
        held:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
      additionalProperties: false

    FundingBucket:
      type: object
      description: >-
        One bucket: the authoritative capacity projection for exactly one
        entitlement cycle or one account's PAYG balance. Exactly one owner,
        ever — `kind` says which, and the schema pins the same rule.
      required:
        - id
        - kind
        - status
        - balances
        - version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - entitlement
            - account
          description: >-
            `entitlement` buckets belong to one entitlement cycle; `account`
            buckets are a PAYG balance. The two are never one bucket, because
            a cycle that rolls must not take the PAYG balance with it.
        entitlement_id:
          type: [string, "null"]
          format: uuid
          description: Present exactly when `kind` is `entitlement`.
        account_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Present exactly when `kind` is `account`. For an entitlement
            bucket this is the owning account too, and the console resolves
            it through the entitlement — the account id is in the row either
            way, because the authorization predicate is evaluated against it.
        status:
          type: string
          enum:
            - active
            - closed
        balances:
          $ref: "#/components/schemas/Balances"
        version:
          type: integer
          format: int64
          description: >-
            The optimistic-concurrency counter. It moves on every leg, and a
            write carries the version it read so a stale one is refused
            rather than merged.
        opened_at:
          type: [string, "null"]
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    LedgerEntry:
      type: object
      description: >-
        One immutable bucket leg: the ledger's unit of record. Legs are
        listed **per bucket** — one operation for one bucket's history, never
        one for all buckets — because a ledger is a fact about where money
        went, and a merged list of every bucket's legs is a question about
        money this plane has no index to answer. The bucket id is therefore a
        path segment on this one operation, and it is the only place a
        resource id appears in a path: it names a bucket, and a bucket the
        session's account does not own is a 404 the query did not return.
      required:
        - id
        - funding_bucket_id
        - kind
        - sequence
        - settled_delta
        - held_delta
        - created_at
      properties:
        id:
          type: string
          format: uuid
        funding_bucket_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - grant
            - topup
            - hold
            - release
            - consume
            - adjustment
          description: >-
            The six kinds the domain declares, with their own semantics
            (`domain/accounting/ledger.go:27-54`). `consume` is the only kind
            carrying a price snapshot, and `adjustment` the only one whose
            deltas are free values — an explicit operator correction with a
            reason, never an overdraw or a credit mechanism.
        sequence:
          type: integer
          format: int64
          description: >-
            The leg's position in its bucket, allocated by the store inside
            the transaction that writes it. It is the keyset this list pages
            on, and it is strictly increasing per bucket, so a page can
            neither skip a leg nor read one twice.
        settled_delta:
          $ref: "#/components/schemas/Money"
        held_delta:
          $ref: "#/components/schemas/Money"
        settlement_id:
          type: [string, "null"]
          format: uuid
        reservation_id:
          type: [string, "null"]
          format: uuid
        command_key:
          type: [string, "null"]
          description: >-
            The topup's idempotency key, when the leg is a `topup`. A retry
            carrying the same key books once.
        price:
          oneOf:
            - $ref: "#/components/schemas/PriceSnapshot"
            - type: "null"
          description: >-
            The consume leg's price provenance, copied **by value** from the
            revision the leg was priced against: the revision id travels as a
            textual reference and the two unit prices as copied values, not
            as a foreign key, because a settlement must be derivable from the
            fact alone and a price re-derived from a moving table is not
            provenance. Present exactly on `consume` legs.
        adjustment_reason:
          type: [string, "null"]
          description: >-
            One sentence for the human who reads the correction. Prose, never
            evidence, and never a payload — the figures belong in the deltas
            above, where they can be compared.
        operator_id:
          type: [string, "null"]
          description: >-
            The operator who wrote an `adjustment` leg. Present on adjustments
            and nowhere else; a correction without one is not a correction, it
            is a bug with a reason attached.
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    # -------------------------------------------------------------------------
    # Payments.
    #
    # Money coming IN, and the two shapes a screen renders of it: the request
    # that names an offer, and the payment that results. The amount is never
    # the client's to name — `CreatePaymentIntentRequest` states why at length
    # — and a payment's state is never the browser's to decide: every move
    # `PaymentIntentState` describes is made from a signed delivery the
    # provider's servers sent to `POST /payment-webhooks/{provider}`, so the
    # only way a client ever learns that a payment succeeded is by reading one
    # of these after the fact.
    # -------------------------------------------------------------------------

    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: "^[A-Z]{3}$"
      description: >-
        An ISO 4217 currency code: exactly three letters, uppercase. It is a
        named schema because two shapes carry one — the price an offer
        publishes and the payment that price becomes — and the two must not be
        able to drift, because an offer's currency IS the currency of the
        payment it opens. The server normalises to this form before storing or
        returning a code, so the pattern describes everything that reaches a
        client rather than imposing an obligation on one: a client may rely on
        what it is handed, and need not repair it.

    PaymentIntentState:
      type: string
      enum:
        - created
        - awaiting_transfer
        - requires_action
        - succeeded
        - failed
        - cancelled
        - expired
        - partially_refunded
        - refunded
        - quarantined
      description: >-
        Where a payment stands. It is the provider's account of the money and
        never the client's: a payment moves because a signed delivery said so,
        and no operation on this surface can set this field.

        `created` is a payment this platform opened **before** it called the
        provider, and it is a durable state rather than a moment: the
        provider's own idempotency key is derived from the payment's identity,
        so the payment has to exist before the call that can fail.
        `awaiting_transfer` is a customer who has been given a destination to
        pay into and has not been seen paying — the state this deployment's
        provider spends a payment's whole life in, because its instrument is a
        bank transfer rather than a page a customer completes. `requires_action`
        is the provider asking the customer for one more step — a separate
        state rather than a flag, because the customer's next act is different
        and a console that rendered the two alike would be telling them to do
        something the provider did not ask for; the provider this deployment
        speaks never reports it, and it is kept because it is a fact about
        money rather than about one provider's vocabulary. `succeeded` is the
        one irreversible move: it is the only state from which a funding leg is
        written, and every balance on a bucket follows from it. `expired` and
        `cancelled` are LOCAL decisions — this platform stopped waiting, or the
        customer walked away — and neither is a fact about the money, which is
        why a delivery arriving later still funds the customer: the provider is
        the only party that gets to say whether they paid.
        `partially_refunded` and `refunded` describe money the provider gave
        back, which changes what the customer keeps and not what was funded;
        they are reachable only from a provider that reports a refund, and this
        deployment's does not, which is a fact about the provider rather than a
        rule this surface enforces. `quarantined` is the one member a payment
        never moves into: it is what a delivery that authenticated and could
        not be interpreted is recorded as, so an operator reads one state
        vocabulary rather than two, and the payment's own status stays whatever
        the money says it is.

    PaymentIntent:
      type: object
      description: >-
        One payment: what this platform asked the provider to collect, and what
        became of it. The amount was priced **here**, from the offer the
        customer named, and it is the figure the ledger is credited with when
        a signed delivery reports the capture — the two are compared, and a
        delivery that disagrees funds nothing.

        `transfer_instructions` is what a customer is handed to pay with:
        where to send the money, and a QR the provider drew. Returned verbatim
        and never parsed: it is a promise the provider makes and this plane
        keeps on the provider's behalf. The status is the provider's word and
        cannot be set by a client — a browser that decided a payment had
        succeeded would be deciding the instant a customer's balance moved.
      required:
        - id
        - status
        - amount_minor_units
        - currency
        - minor_unit_exponent
        - transfer_instructions
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: >-
            This platform's identifier for the payment, minted here. It is
            what the provider is handed as the payment's reference, so a
            delivery names a payment this plane created rather than one the
            payload asked for.
        status:
          $ref: "#/components/schemas/PaymentIntentState"
        amount_minor_units:
          type: integer
          format: int64
          maximum: 9007199254740991
          description: >-
            What the customer is charged, in integer minor units of
            `currency`, and the figure the ledger is credited with. It is
            bounded by `Number.MAX_SAFE_INTEGER` — 2^53 − 1 — and the bound is
            a fact about the CLIENT rather than about the ledger: the console
            is JavaScript, where an integer above that value has no exact
            representation, so an amount this surface returned above it would
            be a figure the console could not compare, add or send back
            without silently rounding it. The ledger holds 64-bit money; the
            ceiling is stated here because this surface's only reader cannot
            read past it.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
          description: >-
            The currency the amount is denominated in. It is on a payment
            although it is deliberately absent from `Money`, because a payment
            is denominated in whatever the customer was charged in — a fact
            about a transaction with a third party — rather than in this
            platform's own settlement unit. A delivery reporting another
            currency is refused rather than converted: this plane has no rate
            and no authority to pick one.
        minor_unit_exponent:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            How many decimal places `currency` is written to, on the same
            terms `TopUpOffer` states: 0 for a currency with no minor unit, up
            to 4 for the few the standard writes further. It travels with the
            payment and not only with the offer, because a payment is read
            long after the offer that priced it may have been withdrawn — the
            exponent is a property of the currency the customer was charged
            in, and a client that had to look it up in the live price list
            would render a historical payment as a different amount the day
            that offer was removed. The amount is integer minor units and
            nothing here places the decimal point for the client; this is the
            figure it needs to place it itself.
        transfer_instructions:
          oneOf:
            - $ref: "#/components/schemas/PaymentTransferInstructions"
            - type: "null"
          description: >-
            How to pay this payment, or null when this plane holds none. Null
            exactly while the payment is `created`: a payment exists before the
            provider has been asked for a destination, deliberately, so that
            the provider's idempotency key can be derived from a durable
            identity. It is also null for a payment whose destination was never
            obtained, which is the state the `503` below describes and the
            state a retry under the same idempotency key resolves.

            It is a copy of what was recorded and not a judgement about the
            payment: a payment whose destination has been recorded keeps it, in
            every later state, because the account it names is the account the
            money is resolved by and a payment whose destination disappeared
            from its own record would be a payment whose deliveries could not
            be explained to the customer who sent them. Whether a destination
            should be SHOWN is a question about the status beside this field,
            and it is a client's to answer rather than this field's to
            pre-answer.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: >-
            When an uncompleted transfer stops being waited on. It is a
            deadline on this platform's PATIENCE and not a fact about the
            money: a delivery arriving after it is still honoured, because the
            provider alone gets to say whether the customer paid.

    # The destination a customer pays into, and the provider's own drawing of
    # it. Three strings and an optional URL, and every one of them is written
    # by the provider and reproduced here unchanged.
    PaymentTransferInstructions:
      type: object
      description: >-
        Where to send the money, as the provider stated it. Every member is
        the provider's own value, returned verbatim: `transfer_code` is the
        reference the payment resolves by when a delivery reports money
        arriving at it, `bank_name` and `account_holder` are what a customer
        checks before sending and what a banking app fills in when the QR is
        scanned, and `qr_url` is an image the provider drew.

        Nothing here has been parsed, normalised or re-derived. A client
        renders these and does not interpret them: a console that read a bank
        or an amount out of `qr_url`, or that composed its own QR from the
        other three, would be reimplementing an encoding the provider owns and
        would break the day that encoding changed.
      required:
        - transfer_code
        - bank_name
        - account_holder
        - qr_url
      properties:
        transfer_code:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The account number the customer transfers to — the provider's
            virtual account for this payment, minted by the provider when
            these instructions were obtained. It is the value the provider
            echoes back when money arrives at it, which is what makes it the
            key a delivery is resolved by, and it is unique to this payment
            across the deployment.

            It is a DESTINATION and not a reference the customer types: the
            customer sends money TO it, which is why it can be the key at all.
            A customer's own free text — the transfer memo — never is, because
            a memo is theirs to edit and their bank's to rewrite, and a
            payment whose correlation rested on one would be a payment that
            stopped resolving the first time somebody's app shortened it.

            Bounded at 255 characters, which is the column's own bound: a
            value longer than this is one this plane could not have stored.
        bank_name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The bank the virtual account is held at, as the provider named it.
            It is shown so a customer can check the destination before sending
            and so a customer typing the account number by hand knows where it
            goes. It is not parsed, not matched against anything, and not a
            code: the provider's spelling is the whole of its meaning.
        account_holder:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The name the account is held in, as the provider stated it. It is
            the third thing a customer checks before sending money and the
            thing their banking app verifies against — the one field that
            tells them the destination is this business and not somebody
            else's. Returned verbatim, like everything else here.
        qr_url:
          type: [string, "null"]
          description: >-
            The provider's own QR image for this transfer, as a URL. Returned
            verbatim and never parsed, rewritten or re-derived by anything on
            this side — the URL is the provider's to shape, and a client that
            read an account number or an amount out of its query string would
            break the day that shape changed.

            Null when the provider drew none, which is a fact about the
            provider's answer and not a failure: the three members above are
            always present and are always enough to pay, and a console that
            treated a missing image as a missing payment would be refusing a
            transfer a customer could make.
      additionalProperties: false

    CreatePaymentIntentRequest:
      type: object
      description: >-
        A customer funding their account, expressed as a request for an OFFER
        rather than as an amount. That is the whole of the design and not a
        simplification: a client-supplied amount is not a smaller version of a
        policy, it is the absence of one. The server prices the offer, and a
        client that could set a price could charge itself one minor unit or a
        billion, with no rule here to refuse either — so `amount_minor_units`
        and `currency` are not fields of this schema, and their absence is the
        requirement rather than an omission. The offer resolves, server-side,
        into an amount and a currency the request never carries. The offers it
        may name are published by `GET /top-up-offers`, which is where a client
        reads a price — and reading one there does not make it settable here.

        `idempotency_key` is required, and the reason is the opposite of the
        reason minting an API key has no key at all: a repeated mint should
        produce a second credential, because the caller meant "give me
        another one", while a repeated TOP-UP must produce one payment,
        because the caller meant "fund me once" and a network retry does not
        change what they meant. A request without a key is therefore refused
        rather than served as a new payment: the server cannot tell a
        double-clicked button from two deliberate top-ups, and a missing key
        makes it guess.
      required:
        - offer
        - idempotency_key
      properties:
        offer:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9_-]+$"
          description: >-
            The top-up offer's identifier, as this deployment publishes it in
            `GET /top-up-offers`. Opaque to the client: it is one of the ids
            that operation returned, it is not an amount, and nothing on this
            side parses it. An offer this deployment does not publish is
            refused rather than guessed at — a request naming one is asking
            for a price that does not exist, and inventing it is the one thing
            this schema exists to prevent.

            The bound and the alphabet are `TopUpOffer.id`'s own, restated
            here rather than left to that schema: an offer this deployment
            could not declare is an offer it cannot publish, so a name outside
            that shape is refused by the lookup and never by a shape check —
            the refusal is the same 400 an unknown name gets, and a caller
            that reads this line only needs to know which strings could ever
            name something.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The caller's identity for this top-up, bounded at 128 characters.
            Every attempt at the same logical top-up carries the same value —
            the first try, the retry after a dropped response, and the retry
            after a provider outage — and a request repeating a key is
            answered with the payment that key already names rather than with
            a second one. That payment may be in any state by then, including
            one that has already succeeded, and the honest thing for a client
            to do with a converged answer is render what it was told: a retry
            after a customer paid must not present them with a destination to
            send money to again.
      additionalProperties: false

    TopUpOffer:
      type: object
      description: >-
        One price this deployment publishes: what a customer is charged if they
        choose it, expressed here and nowhere else. It is a row of a price list
        rather than a fact about an account, which is why it carries no account
        and why reading it is not a read of anybody's data.

        The label is the only member a chooser renders and the only one that is
        not authority: it is presentation, the amount and the currency are the
        price, and a client that preferred the label's number to
        `amount_minor_units` would be pricing a top-up itself — which is the
        one thing `CreatePaymentIntentRequest` exists to make impossible.
      required:
        - id
        - amount_minor_units
        - currency
        - minor_unit_exponent
        - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9_-]+$"
          description: >-
            The offer's identifier, and the exact value
            `CreatePaymentIntentRequest.offer` carries. Same bound, same
            opacity: it is a name, not an amount, and it is the only thing a
            request says about what to charge.

            The shape is the deployment's rather than a convention a client
            invented, and it is stated because it is checkable rather than
            because it is a rule this operation enforces: an offer is declared
            by an operator, that offer's own settings are spelled from its id,
            and an id outside this alphabet or over this length could not be
            declared at all — so no name of any other shape can be an offer
            this surface publishes. A request carrying one is refused exactly
            as an unknown name is refused, by the lookup and not by a shape
            check: the answer is the 400 that says this deployment does not
            publish that offer, which is the same answer for both.
        amount_minor_units:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: >-
            What choosing this offer charges, in integer minor units of
            `currency`. Strictly positive, because a free offer is not a
            top-up and a zero here would be a payment that funds nothing while
            still taking a destination from the provider that another payment
            could have used. Bounded by
            `Number.MAX_SAFE_INTEGER` — 2^53 − 1 — for the same reason
            `PaymentIntent.amount_minor_units` is: the console is JavaScript,
            where an integer above it has no exact representation, so a price
            this surface published above it would be a number the console
            could not compare or render without silently rounding it.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
          description: >-
            The currency of this price, and therefore the currency of the
            payment it opens: an offer's currency IS the payment's currency,
            because nothing on this surface converts. This plane refuses a
            provider delivery reporting any other currency rather than
            converting it, so an offer whose currency disagreed with the
            deployment's settlement currency (issue #63's singleton) is a
            deployment misconfiguration for an operator to fix, not a client's
            problem to work around.
        minor_unit_exponent:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            How many decimal places `currency` is written to — 0 for a
            currency with no minor unit, up to 4 for the few the standard
            writes further. It is the exponent the server uses to place a
            decimal point when a human-facing amount is rendered, and it
            travels so a client can do the same without carrying its own
            currency table: the range is bounded and enforced here rather than
            the client holding a list of codes that would be stale the day a
            currency was added.
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            A human-readable name for the offer — the string a chooser shows.
            Presentation and not authority: it is not priced, not parsed, and
            not a stable identifier.

            It is REQUIRED, and the requirement is the deployment's own rather
            than a preference of this schema: every offer an operator declares
            carries a label, a missing one is refused where the offer is
            declared, and a label that is only whitespace is refused exactly
            as a missing one is, because whitespace is not a name. The refusal
            happens when the deployment starts rather than when a chooser is
            rendered, and that is the point of it — an offer with no name is a
            price a screen would have to show without a word for it, and a
            price list that cannot be rendered is a configuration error an
            operator has to see, not a blank row a customer discovers.

            Bounded at 120 characters, which is a bound on SIZE rather than on
            shape: a label is prose and is shown to a customer as it was
            configured, and what this stops is a configuration value that is
            really a document arriving in a list that arrives whole.
      additionalProperties: false

    TopUpOfferList:
      type: object
      description: >-
        The offers this deployment publishes, in the order an operator declared
        them. That order is a presentation decision rather than a promise about
        data, and it is what a chooser renders.

        Deliberately NOT a `PageEnvelope`: every other list on this surface
        pages, and this one cannot honestly do so. A cursor names a POSITION in
        a history, and a price list has no position to name — the offers are
        the deployment's configuration, fixed until somebody edits it, so the
        set cannot shift under a reader the way a table of rows does, and a
        cursor into it would be a claim about an ordering that only exists
        because a person wrote it down. There is no `total` either, for the
        reason this file states at the top: a count this plane would have to
        maintain is a count that goes stale, and nothing here needs one.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopUpOffer"
          description: >-
            The published offers. A deployment publishes a handful, and the
            list does not grow with request volume, which is the other half of
            why it arrives whole.
      additionalProperties: false

    # The one schema in this file that is not a console fragment. It belongs to
    # `POST /payment-webhooks/{provider}`, which is the payment provider's own
    # endpoint — declared in `console.yaml` because the operation is this
    # application's, and reachable by no browser. It lives here because this
    # document holds no inline schemas at all: every shape a client reads is in
    # this fragment, and the provider's acknowledgement is a shape a reader of
    # this contract meets.
    WebhookAcknowledgement:
      type: object
      description: >-
        The one body a webhook 2xx carries, and it is deliberately the same
        body for EVERY outcome an authenticated delivery can have: applied,
        already recorded, quarantined, and a delivery whose event is not
        readable at all. The rule it encodes is that **2xx means "this event
        needs no further delivery from you"** and nothing more. A quarantined
        delivery is one this build authenticated and could not interpret — an
        event kind it has no rule for, a schema ahead of it — and it is
        recorded where it can be, as an operator's work item; refusing it would
        put a permanent refusal into the provider's retry budget, and a retry
        storm is what comes out of that. A delivery with no readable event id
        is acknowledged the same way and recorded nowhere but the log, because
        the record of a delivery is keyed by the event id it reports and an
        absent id would swallow the next unreadable delivery as a duplicate.
        Naming the disposition here would invite a provider's implementation to
        branch on it, which is a decision the provider has no business making
        and one this plane could not make true.
      required:
        - success
      properties:
        success:
          type: boolean
          description: >-
            Always true. It acknowledges the delivery and says nothing about
            it — not the disposition, not the payment, not the amount. A
            provider that read more into an acknowledgement than "stop sending
            this one" would be reading a claim this body does not make.

            The member is spelled `success` rather than `received` because the
            provider this deployment speaks names it, and the name is
            load-bearing in a way a field name usually is not: that provider
            decides from this body whether a delivery was accepted at all, so
            a body it does not recognise as an acknowledgement would be a
            delivery it retries. This is the one member of this contract whose
            spelling is somebody else's, and the operation's description says
            what that costs — the response is written as exact bytes rather
            than produced by a serialiser, because a serialiser is free to
            reformat, and "the same members in a different order" is
            indistinguishable from "not an acknowledgement" to the program
            reading it.
      additionalProperties: false

    PriceSnapshot:
      type: object
      required:
        - revision_id
        - input_unit_price
        - output_unit_price
      properties:
        revision_id:
          type: string
          description: The pricing revision this leg was priced against.
        input_unit_price:
          $ref: "#/components/schemas/Money"
        output_unit_price:
          $ref: "#/components/schemas/Money"
      additionalProperties: false

    Plan:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    PlanVersion:
      type: object
      description: >-
        One version of a plan's terms. A plan has many versions and only one
        current; a subscription pins the version it bought, so retiring a
        version never changes what a live subscriber was sold.
      required:
        - id
        - plan_id
        - version_number
        - state
        - period
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - draft
            - published
            - retired
          description: >-
            `published` is the only state that accepts new subscriptions;
            `retired` is what a superseded version becomes, and it is
            deliberately **not** terminal in the way `revoked` is — an
            existing subscription continues on a retired version, because
            purchased scope never changes retroactively (ADR 0003).
        period:
          type: string
          enum:
            - calendar_month
            - fixed_term
        recurring_price_minor_units:
          type: [integer, "null"]
          format: int64
          description: >-
            The recurring price, or null on a fixed-term version where there
            is no recurrence. The same minor-units-with-no-currency caveat as
            every other money value here applies.
        published_at:
          type: [string, "null"]
          format: date-time
        retired_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    Subscription:
      type: object
      required:
        - id
        - account_id
        - plan_version_id
        - state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        plan_version_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - active
            - suspended
            - cancelled
            - expired
        starts_at:
          type: string
          format: date-time
        current_period_start:
          type: [string, "null"]
          format: date-time
          description: >-
            Null exactly while the subscription is `pending`, and non-null in
            every other state.
        current_period_end:
          type: [string, "null"]
          format: date-time
        cancel_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When a scheduled cancellation takes effect. A scheduled
            cancellation is **data, not a state**: the subscription stays
            `active` and usable until this instant passes, which is why the
            state enum has no "cancelling" member and why an operator looking
            at a `cancelled` subscription is looking at one that has already
            stopped.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    Entitlement:
      type: object
      description: >-
        One live quota grant materialised from exactly one
        (subscription, cycle, grant definition). The row is immutable after
        the roll except its terminal state flip, and it carries **no balance
        column** — capacity is drawn down in Accounting's buckets and the
        runtime's quota projections, and a balance here would be a third copy
        of the same number with no rebuild story. A console that showed
        "remaining" from this row would be showing nothing at all; the
        remaining figure lives on the bucket, and the two are deliberately
        separate reads.
      required:
        - id
        - subscription_id
        - cycle
        - state
        - period_start
        - period_end
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        grant_definition_id:
          type: string
          format: uuid
        cycle:
          type: integer
          minimum: 1
          description: >-
            Which cycle of the subscription this grant is for. A retried roll
            cannot grant a cycle twice — the schema's
            `entitlements_grant_once_per_cycle` makes the triple unique, and
            this number is the third of it.
        scope:
          type: string
          description: >-
            The alias-group **name** the grant is scoped to. The pinned scope
            is a version id, resolved through the Data Plane that owns the
            catalog; this is the name an operator reads, and the console does
            not resolve the version itself.
        dimension:
          type: string
          enum:
            - cost
          description: >-
            The only dimension today, `cost`. It is an enum with one member
            rather than a free string because the second one is a
            compatibility surface: a `requests` or `tokens` dimension would
            change what every number in this API means, and that has not
            happened.
        granted_minor_units:
          type: integer
          format: int64
        scope_version_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - active
            - expired
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    Finding:
      type: object
      description: >-
        One recorded divergence. A finding's identity is
        `(check_kind, subject_kind, subject_id)` and nothing else — not a
        message, not a timestamp, and not a run id — so the same divergence
        seen by two passes is one row whose `last_seen_at` moved, not a second
        row. That is what makes the table bounded and what makes a re-run
        over unchanged data open zero findings.

        The `observed` evidence is opaque to the console: it is structured
        JSON written by the check that found the divergence, and a new check
        is a new evidence shape rather than a migration. It is rendered as
        text, never interpreted, and never summed.
      required:
        - id
        - check_kind
        - subject_kind
        - subject_id
        - severity
        - status
        - detected_at
        - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        check_kind:
          type: string
          description: >-
            Which invariant was violated. A closed vocabulary this plane owns
            rather than free text, and two checks with different names are
            different findings even about the same subject.
        subject_kind:
          type: string
          enum:
            - funding_bucket
            - settlement
            - request
            - control_plane
          description: >-
            What the invariant was violated on. `control_plane` is the
            literal subject for a feed-wide signal, which is why it is a
            member of the enum and not a sentinel an operator has to
            recognise.
        subject_id:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
          description: >-
            How much it matters, **written once and never moved**. A finding
            whose severity were editable would let a reader re-grade the
            evidence instead of resolving it, which is the one thing this
            table exists to make hard.
        status:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
        observed:
          type: object
          additionalProperties: true
          description: >-
            The evidence the check compared, as this plane's checks wrote it.
            Every writer is one of this plane's own checks — never a provider
            blob, never a raw prompt, never a fact payload — and its shape is
            not this contract's to fix.
        detail:
          type: string
          description: >-
            One sentence for the human who resolves the finding. Prose, never
            a payload: the figures belong in `observed`, where they can be
            compared.
        detected_at:
          type: string
          format: date-time
          description: When the **first** pass saw this divergence.
        last_seen_at:
          type: string
          format: date-time
          description: When the most recent pass saw it still true.
        resolved_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false

    ReconciliationRun:
      type: object
      description: >-
        One reconciliation pass: the half-open window it swept, when it
        started, how it ended, and the three counters that say what it did. A
        run whose `finished_at` is null is a pass that started and never
        finished, which is a fact worth rendering rather than hiding — it is
        indistinguishable from an idle worker if it is not.
      required:
        - id
        - scope
        - status
        - window_from
        - window_to
        - started_at
        - buckets_scanned
        - findings_opened
        - findings_unchanged
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
        status:
          type: string
          enum:
            - running
            - completed
            - failed
        window_from:
          type: string
          format: date-time
          description: Inclusive.
        window_to:
          type: string
          format: date-time
          description: >-
            Exclusive, and the high-water mark the **next** pass opens from.
            The console renders both halves of a half-open window, because a
            window rendered as an inclusive pair is a window an operator
            cannot tell from one that overlapped the last.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        buckets_scanned:
          type: integer
          format: int64
        findings_opened:
          type: integer
          format: int64
        findings_unchanged:
          type: integer
          format: int64
          description: >-
            What a re-run shows: the same divergence seen again is a
            re-confirmation, not a new finding. An operator reading a run with
            a high `findings_unchanged` is looking at a healthy pass, and a
            console that did not show the figure would make it look like a
            broken one.
      additionalProperties: false

    AccountOverview:
      type: object
      description: >-
        The dashboard's one composition: figures that live in three bounded
        contexts, assembled **server-side** into a single operation. This is
        the BFF composition ADR 0012 §1 settles — a use case in
        `internal/application` returning a projection this contract declares,
        never arithmetic across three responses in a page component, and never
        a new package. The account comes from the session.
      required:
        - account
      properties:
        account:
          $ref: "#/components/schemas/Account"
        user_count:
          type: integer
          description: >-
            How many live users the account has. It is a **count of a
            filtered, bounded set** — invited plus active, excluding removed —
            and is the one figure on this schema that is a number about the
            collection rather than about one row. It is cheap because the
            predicate is indexed, and it is here rather than inferred by
            paging a list because an operator reading "12 users" should not
            have to page eleven screens to learn there are twelve.
        active_api_key_count:
          type: integer
          description: >-
            How many keys are currently active. Revoked keys are counted
            separately in the key list, never here: a dashboard that said
            "12 keys" with twelve revoked among them would be describing
            history as if it were capacity.
        subscriptions:
          type: array
          description: >-
            The account's subscriptions, most recent first, bounded by the
            contract's own `maximum` rather than by a total. A dashboard
            showing three of eleven is honest; one claiming to show all
            eleven is making a promise this plane will not keep.
          items:
            $ref: "#/components/schemas/Subscription"
        payg_balances:
          type: array
          description: >-
            The account's PAYG buckets with their three balances, rendered
            and never computed.
          items:
            $ref: "#/components/schemas/FundingBucket"
        open_finding_count:
          type: integer
          description: >-
            How many reconciliation findings are open. It is a whole-plane
            fact and therefore the one number here that is not the account's
            alone: an operator reading it learns how the system is doing, not
            what this customer owes.
      additionalProperties: false

    # -------------------------------------------------------------------------
    # Pages.
    #
    # One shape, six uses, and the shape is the point: every list on this
    # surface answers with the same three facts and nothing else. `items` is
    # the page, `next_cursor` is where to continue, `has_more` says whether
    # continuing is worth it — and there is deliberately no fourth field.
    #
    # The absence of `total` is not an oversight and not a simplification.
    # Computing one over a table this plane is still growing means either a
    # second query whose answer is a different instant from the page's, or a
    # COUNT the first page pays for and the last one wastes. Either way the
    # number is wrong the moment it is written and nobody recomputes it. A
    # console that shows "1–50 of 3,241" is showing an operator a figure that
    # looks authoritative and is not; one that shows "more" and means it is
    # showing them something true.
    #
    # `next_cursor` is non-empty on **every** page, including the last. A page
    # that carries none is not a page a client can hold: a client asked to
    # continue from an empty position would resume from the beginning of
    # retained history on every page, re-reading the same rows forever behind
    # a position that never moves. The last page's cursor resumes the walk and
    # returns an empty page, which is the honest answer.
    #
    # An EMPTY page's `next_cursor` is the one cursor in this surface not
    # derived from a row: it names the position the page was REQUESTED FROM
    # (the beginning for a first page). That is the truth about where the walk
    # stands, and it is what prevents an empty page from being told it is at
    # the start of the collection — naming the start would be a different
    # position, and a console that stored it would re-read page one forever.
    # -------------------------------------------------------------------------

    PageEnvelope:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          description: The rows on this page. May be empty, and an empty
            first page is a legitimate answer — an account with no users is
            not an error.
        next_cursor:
          $ref: "#/components/schemas/Cursor"
        has_more:
          type: boolean
          description: >-
            Whether rows exist past this page. This — not the page's length —
            is the only honest end-of-collection signal, because a short page
            is also what a concurrent write produces. A page shorter than the
            requested limit with `has_more: true` is a normal page, and a
            client that treats a short page as the end is the bug this field
            exists to prevent.
      additionalProperties: false

