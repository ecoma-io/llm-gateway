# The shape of the usage-fact feed the Control Plane reads: the page it gets
# back, and the two query parameters it may send. It is what a caller of the
# façade may rely on, and it is contracted at the façade because the façade is
# where a contracted caller arrives.
#
# This is a fragment like its siblings — a `components:` tree `dataplane.yaml`
# references by relative path — and it states the one cross-plane contract the
# Control Plane depends on for money. Its direction is the opposite of
# everything else in `dataplane.yaml`: the other operations are the Control
# Plane asking the Data Plane to change something the Data Plane owns, and this
# one is the Control Plane reading what the Data Plane already recorded.
#
# The process behind the façade serves the same page over a private protocol —
# same field names, same types, same cursor — and that agreement is pinned by a
# protocol test on each side rather than by this document describing both ends
# (docs/architecture/cross-plane-protocols.md). The difference between the two
# hops is not the page; it is who authenticates whom and which surface the
# apology comes from.
#
# The delivery model is **pull with replay**, and it is chosen rather than
# inherited (ADR 0006 §5):
#
#   - the runtime must keep serving with the Control Plane down, so nothing on
#     the request path may depend on a cross-plane call;
#   - the runtime already owns the immutable facts, so the Control Plane reads
#     them rather than being pushed at;
#   - retry and crash recovery are trivial against a durable, ordered feed and a
#     consumer-side position, and awkward against a push;
#   - settlement is idempotent by `request_id`, so redelivery costs nothing.
#
# Three rules follow, and they are the whole protocol:
#
#   1. **The cursor is opaque.** It names a position in the Data Plane's fact
#      order. No consumer may parse it, synthesise it, compare it or order by
#      it, and nothing outside the Data Plane constructs one. Its encoding is
#      the Data Plane's to change; treating it as a value with meaning is what
#      makes that change breaking.
#   2. **Replay is normal.** The same range may be requested any number of
#      times, and repeated delivery is expected rather than an error. There is
#      no acknowledgements endpoint, no consume-and-delete, and no way for a
#      consumer to tell the Data Plane it has finished with anything — the
#      facts are durable history and the consumer's position is the consumer's.
#   3. **The consumer advances its own position, after applying.** A consumer
#      stores the `next_cursor` it has acted on and only after the facts up to
#      it are durably recorded; a crash between the two replays, which is safe
#      because applying a fact twice is a no-op. The Control Plane owns
#      `control.usage_ingestion_cursor`; the Data Plane never learns it.
#
# Ordering is a single monotonic append sequence assigned by the Data Plane at
# the moment a fact commits — a gap-aware sequence, so an aborted transaction
# leaves a hole that is skipped rather than a reordering. It is deliberately
# not `occurred_at`, not physical row order, and not an unordered identifier:
# replay needs a total order that survives a concurrent writer, and only an
# append sequence gives one.
components:
  parameters:
    UsageEventsAfter:
      name: after
      in: query
      required: false
      description: >-
        An opaque cursor naming the position after which facts are wanted. Omit
        it to begin at the oldest fact still retained. The value is not
        interpreted by the caller or by the management API that forwards it:
        pass back the `next_cursor` of the previous page, or nothing.
      schema:
        $ref: "#/components/schemas/UsageCursor"
    UsageEventsLimit:
      name: limit
      in: query
      required: false
      description: >-
        The largest number of facts to return. A page smaller than this does
        not by itself mean the feed is drained — read `has_more` for that,
        because a shorter page is also what a concurrent writer produces.


        The bounds are enforced rather than approximated, and enforced
        identically by every hop that receives the parameter: omitted means the
        default below, a value below `minimum` or above `maximum` — and a value
        that is not an integer at all — is refused with `400 invalid_request`,
        and a value inside the bounds is served as asked. Nothing is clamped.

        A caller that asked for a larger page than this operation will return
        has asked a question the contract does not answer, and the smaller page
        it would otherwise get is one it cannot tell apart from a page capped by
        the feed itself: `has_more` reports that facts exist beyond the page,
        not that this caller's own page size was ignored. A consumer sizing a
        page to fit what it can hold in memory would learn about the mismatch
        nowhere, which is why the answer is a refusal it can act on rather than
        a number it did not ask for.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  schemas:
    UsageCursor:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        An opaque position in the Data Plane's fact order. It is safe to store
        and to send back verbatim; it is not safe to interpret, and no consumer
        may do so. A cursor this surface cannot place — malformed, or past the
        retained history — is refused rather than approximated.
    UsageEvent:
      type: object
      required:
        - append_seq
        - request_id
        - kind
        - schema_version
        - occurred_at
        - payload
        - capture_method
        - committed_attempt_id
        - provider_input_tokens
        - provider_output_tokens
        - delivery_tokens
        - price_revision_id
        - input_unit_price
        - output_unit_price
        - settled_amount
        - corrects_append_seq
      description: >-
        One immutable fact the runtime recorded about a request it handled, and
        everything a settlement is derived from. The settlement figures travel
        beside the payload as typed fields on purpose: a Control Plane
        settlement has to be derivable from the fact alone, with no synchronous
        call back into the Data Plane, and a consumer that had to parse this
        table's payload shape to price anything would be coupled to a schema
        this envelope exists to keep versioned. The payload still travels whole
        beside them — it is the allocation tail's shape, versioned by
        `schema_version`.


        Every field below is carried by every fact. A nullable field's null is
        the claim that this fact makes no such claim — a different sentence
        from a stored zero, which is why nullability crosses the wire exactly:
        a free model settles at a real zero amount, and an absent usage report
        is an absence, not a zero.


        Which fields are non-null is decided by `kind` and only by `kind`. In
        this feed's production vocabulary: a `settled` fact carries
        `capture_method`, `committed_attempt_id`, `settled_amount`,
        `price_revision_id` and both unit prices, together with the three
        token figures — and the two `provider_*_tokens` are the **priced**
        figures under the substitution ladder their own field descriptions
        state, not the provider's raw report: the provider's report prices
        when it arrived within the reservation, and the reservation's own
        basis prices when it did not, with `capture_method` attesting which
        arm priced. A figure the runtime could not observe is never invented;
        the engine permits null counts on a settled fact for exactly that
        case, and a null count prices as zero in the settled amount — it is
        never a reason to skip the re-derivation below. A `released` or
        `expired` fact carries none of the settlement fields at all — no
        usage claim, no price, no amount. An `unbillable_orphaned` fact
        carries `capture_method`, `committed_attempt_id` and the token
        figures on the same priced-figure terms as a `settled` fact's, and
        never a price or an amount, because no money moved.


        `corrects_append_seq` is null on every fact this feed's producer
        writes; it is declared for the correction path a later generation
        may add. A consumer that does not implement that path must **refuse**
        any fact where it is non-null — loudly, as a state a human resolves —
        and never treat it as a replay of the fact it names: the kind-classed
        idempotency key would otherwise swallow the correction and leave the
        wrong money standing.
      properties:
        append_seq:
          type: integer
          minimum: 1
          description: >-
            The fact's position in the Data Plane's single monotonic append
            order — the identity of this fact on the wire. Two facts of one
            request never share one, and a correction, when the day comes,
            names the fact it amends through it. It is deliberately **not** the
            consumer's idempotency key: deduplication keys on `request_id` and
            the kind's class, and a consumer that deduplicated by position
            would treat a replayed page as fresh facts.
        request_id:
          type: string
          description: >-
            The runtime request this fact is about, and the logical idempotency
            key for everything derived from it — keyed by kind class, never
            alone: at most one settlement-relevant fact (`settled`, `released`
            or `expired` — the three are mutually exclusive) and at most one
            `unbillable_orphaned` fact exist per `request_id`, and the orphan
            may coexist with any of the three by design. A settlement, a
            consume leg and a release leg are each created at most once per
            `request_id` and kind class, however many times the fact is
            delivered. It is the fact's immutable business identity and is
            **not** the HTTP `X-Request-Id`, which correlates a call and means
            nothing across a retry.


            One substitution a consumer of the legs should know: on this feed
            the `request_id` is also the reservation's identity. The runtime
            mints exactly one reservation per request — uniqueness on
            `request_id` is total — so a consume or release leg derived from
            this fact names the reservation through the request id, and no
            separate reservation field exists because there is no second value
            to carry.
        kind:
          type: string
          enum:
            - settled
            - released
            - expired
            - unbillable_orphaned
          description: >-
            The terminal outcome the fact records — and, normatively, the only
            input to which derivation a consumer performs: the kind and nothing
            else decides which legs a fact produces. A `settled` fact is the
            only kind from which consume legs are derived, together with the
            settled total; `released` and `expired` derive release legs alone;
            `unbillable_orphaned` derives no legs and no charge at all. A
            consumer that inferred the split from a fact's figures rather than
            from its kind would price an orphan or release a settlement, and
            the coexistence rule on `request_id` above is what makes the
            inference wrong rather than merely unusual. The vocabulary is
            terminal on purpose — a hold is Data-Plane reservation state, not a
            fact of its own, so no kind delivers one; what a consumer learns of
            a hold rides in each fact's allocation tail.
        schema_version:
          type: integer
          minimum: 1
          description: >-
            The version of the payload shape this fact was written with. A
            consumer that meets a version it does not know refuses the fact
            rather than guessing, because guessing at settlement is guessing
            with money.
        occurred_at:
          type: string
          format: date-time
          description: >-
            When the runtime observed the outcome. Informational: it is never
            the ordering key and never the deduplication key — clocks disagree
            between processes and two facts can share a millisecond.
        payload:
          type: object
          additionalProperties: true
          description: >-
            The fact's body. Its columns are the schema PR's to decide; this
            contract fixes the envelope around them, not their shape. What the
            envelope does fix is the requirement it must satisfy: a Control
            Plane settlement has to be derivable from the fact alone, with no
            synchronous call back into the Data Plane — so the body must carry
            the allocation and bucket identities and the immutable reservation
            figures needed to derive the consume legs, the release legs and the
            settled total (ADR 0006, amendments to ADR 0004).


            Version 1 satisfies it with one object —
            `{"allocations": [...]}` — whose entries are the reservation's
            waterfall legs, each carrying `funding_bucket_id` (text),
            `amount` (the held amount that leg booked, integer minor units,
            at least 1) and `ordinal` (the leg's place in the waterfall,
            integer, contiguous from 1 in drawdown order). The leg amounts
            sum to the hold the fact closes out. On a settled fact a
            positive `settled_amount` is carried by a non-empty allocation
            list and a zero `settled_amount` by an empty one — the
            zero-priced hold draws no legs, and a fact whose amount and tail
            disagree is malformed, not priced.


            The consumer's derivation over the tail is normative, so two
            consumers derive identical legs: walk the legs in ascending
            `ordinal` order, consume `min(remaining, amount)` per leg — the
            settled total is consumed greedy from the waterfall's head, the
            boundary leg may be partially consumed — and release each leg's
            unconsumed remainder. `released` and `expired` facts release
            every leg in full and derive no consume legs;
            `unbillable_orphaned` derives no legs at all. A tail that cannot
            absorb the settled total (its amounts sum to less than the
            amount), or a settled total left with a remainder over a
            exhausted tail, is refused — never converged around.
        capture_method:
          type: [string, "null"]
          enum:
            - reported
            - gateway_observed
            - reservation_floor
            - null
          description: >-
            How the fact's usage figures were known — `reported` when the
            provider's own figures priced as given, `gateway_observed` when a
            priced figure is the gateway's own count, `reservation_floor` when
            a settled figure is the reservation's own bound. Null on the facts
            that carry no usage claim: `released` and `expired`.
        committed_attempt_id:
          type: [string, "null"]
          description: >-
            The upstream call the usage belongs to. Null on every fact that
            names no attempt: `released` and `expired`.
        provider_input_tokens:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The input figure the settlement priced — not the provider's raw
            report. The provider's report prices when it arrived within the
            reservation; the reservation's admitted input count prices
            when the report exceeded it or never arrived. `capture_method`
            attests which arm priced; the raw report itself stays beside the
            attempt row as telemetry and does not travel this feed. Null on
            `released` and `expired`.
        provider_output_tokens:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The output figure the settlement priced — not the provider's raw
            report. A completed answer prices the provider's report bounded by
            the reservation's output basis, or the gateway's delivered count
            under that bound when no report arrived. A stream that failed
            after commitment prices the delivered tokens under the bound and
            never the provider's figure — the provider's count for a stream it
            never finished is the attempt row's telemetry, not a customer
            bill (ADR 0004). `capture_method` attests which arm priced. Null
            on `released` and `expired`.
        delivery_tokens:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The gateway's own count of the answer bytes that left the process —
            the canonical v1 byte rule, recorded beside every settlement and
            every orphan as the delivery side. It is never priced by this
            feed's arithmetic (ADR 0003 prices input and output only); it is
            the figure a consumer can audit a settlement's output figure
            against. Null on `released` and `expired`.
        price_revision_id:
          type: [string, "null"]
          description: >-
            The price revision the settlement was priced at, present together
            with the two unit prices or not at all. A later price change never
            rewrites it. Null on every non-settled fact.
        input_unit_price:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The input price, in integer minor units per 1M tokens, copied from
            the revision named above. Null on every non-settled fact.
        output_unit_price:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The output price, in integer minor units per 1M tokens, copied from
            the revision named above. Null on every non-settled fact.
        settled_amount:
          type: [integer, "null"]
          minimum: 0
          description: >-
            What the request cost, in integer minor units — on a settled fact,
            the hold formula re-derived over this fact's own figures and
            prices, and that equality is the fact's binding: a consumer can
            re-derive the amount from the fact alone and must find this
            number. The formula, normatively, is one ceiling over the summed
            raw product —


            `settled_amount = ceil((input_tokens × input_unit_price +
            output_tokens × output_unit_price) / 1_000_000)` —


            with a null count pricing as zero, `delivery_tokens` never priced
            (ADR 0003 prices input and output only), and the ceiling taken
            once over the sum, never per leg: two ceilings would round each
            leg up independently and overstate the amount by up to one minor
            unit. A consumer re-deriving with per-leg ceilings or a
            different rounding will refuse every remainder-bearing fact, so
            the formula is stated here rather than left to be reinvented.
            Zero is a real settled amount (a free model, or a zero report);
            null on every non-settled fact, because no money moved.
        corrects_append_seq:
          type: [integer, "null"]
          minimum: 1
          description: >-
            Reserved for the correction path: a later fact naming the
            `append_seq` of the one it amends. Null on every fact this feed's
            producer writes today.
    UsageFactPage:
      type: object
      required:
        - events
        - next_cursor
        - has_more
      properties:
        events:
          type: array
          description: >-
            The facts, in ascending append order, strictly after the requested
            position. At most one settlement-relevant fact (`settled`,
            `released` or `expired`) and at most one `unbillable_orphaned`
            fact exist per `request_id`, and an orphan may coexist with a
            settlement-relevant fact for the same request — usage observed on
            a request whose ending another writer stated is exactly the
            telemetry the orphan exists to carry. The idempotency key is
            therefore `request_id` **and kind class**, never `request_id`
            alone: a consumer that deduplicated by `request_id` alone would
            drop the second fact it saw — losing a settlement because an
            orphan arrived first, or losing the orphan because a settlement
            did.


            A page is served whole and must be applied whole: a fact a
            consumer cannot decode or apply stops the consumer at that fact,
            and no page may be skipped past. This contract deliberately gives
            a consumer no way to advance around a fact it could not handle —
            the alternative is a position that silently skips a fact, and the
            gap would surface later as money that cannot be accounted for. A
            fact that stops the feed is a state a human resolves, not a
            position a consumer rounds forward.
          items:
            $ref: "#/components/schemas/UsageEvent"
        next_cursor:
          allOf:
            - $ref: "#/components/schemas/UsageCursor"
          description: >-
            The position of the last fact in this page, and therefore where the
            next read resumes: strictly after it. Store it and send it back as
            `after` once every fact above is applied, and the facts above it are
            not returned again — the same range may be re-read by sending the
            previous cursor, which is what makes a crash between applying and
            storing safe rather than lossy.


            It is never empty, including when the page carries no facts. A
            consumer that has caught up gets back the position it sent; a
            consumer reading from the beginning of retained history — no
            `after` — gets the position the Data Plane assigns to it. An empty
            `next_cursor` would be a page with no position to resume from, and a
            consumer that stored one would ask from the beginning of retained
            history on every cycle and never advance.
        has_more:
          type: boolean
          description: >-
            Whether facts exist beyond this page. `false` means the consumer has
            reached the end of what the Data Plane has committed *so far* — not
            that it will never have more, since the runtime keeps writing.
      additionalProperties: false
