# The wire shapes every one of the gateway's three contracts shares: the
# request-correlation header, the health body, and the version body.
#
# These are fragments, not documents. They carry no `openapi:` key and no
# `paths:`; each is a `components:` tree that the three contracts reference by
# relative path. That is the whole reason they exist: a schema that three
# surfaces must agree on is a schema that should be stated once, and the
# alternative — three copies — is three chances for the console's client and
# the runtime's response to drift apart while both stay green.
#
# What is deliberately NOT here: the probe *endpoints*. All three applications
# serve /healthz, /readyz and /version, and it would be tempting to share those
# path items too. They stay per-document because they will diverge — the
# Control Plane's readiness will gate on its database, the runtime's on its own
# state, the management API's on reaching the Data Plane — and a shared path
# item would either force them identical or grow a per-document override for
# every sentence. The wire shape is shared; the surface is not.
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        An optional caller-generated request identifier. The gateway accepts it
        only when it is 1–64 ASCII letters, digits, periods, underscores, or
        hyphens; otherwise it generates a new identifier. The chosen identifier
        is returned in the X-Request-Id response header and, for errors, in the
        ErrorEnvelope request_id field.
      schema:
        $ref: "#/components/schemas/RequestId"
  headers:
    RequestId:
      description: >-
        The request identifier accepted from the caller or generated by the
        gateway. It is safe for bounded correlation in logs and client reports.
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._-]{1,64}$"
      description: >-
        A bounded, safe-to-log request correlation identifier. The gateway uses
        a generated identifier when a supplied header does not meet this shape.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: '"ok" today; the vocabulary grows only through this contract.'
      additionalProperties: false
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: The build version injected through the application binary's ldflags.
      additionalProperties: false
