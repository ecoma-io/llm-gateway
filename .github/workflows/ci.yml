name: CI

on:
  # Deliberately NOT filtered to `branches: [main]`. A filter there skips CI
  # entirely on a stacked pull request — one targeting another feature branch —
  # so the branch merges having never been checked, and the failure only appears
  # later against someone else's change.
  # `types` replaces the default set (opened, synchronize, reopened) rather
  # than adding to it, so `edited` has to name its siblings explicitly. The
  # PR title becomes the subject of the squash commit on `main`, and a title
  # edited to something invalid after the checks went green would otherwise
  # keep its stale pass forever — nothing revalidates it at merge time.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    # `main` is the one development line: its merged tree runs the full suite
    # on every push, so a red push names its commit instead of surfacing in a
    # release lane later.
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-console:
    name: Verify (console)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Moon's VCS layer wants the base branch ref; a shallow clone lacks
          # it, and the jobs here run Moon. Full history is Moon's own
          # recommended CI setup.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge, which is the entire reason
      # the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # The semantic half of the contract gate, and it runs on every event
      # including the merge queue — unlike the formatting check above, which is
      # a pure function of one file's own bytes. A merge brings another pull
      # request's documents in alongside this one's, and two documents that are
      # each valid can still leave a `$ref` dangling across them; the route
      # tables in each Go module check the other half (that a process serves
      # exactly what its document declares) and neither subsumes the other.
      # Fails at `warning` severity, so a rule this corpus breaks on purpose is
      # a justified entry in .spectral.yaml rather than a silent pass.
      - name: Validate the OpenAPI documents
        run: pnpm openapi:check

      # Asserts every directory under `apps/` and `packages/` is a project
      # Moon can see with the four targets. Runs BEFORE the Moon step, so an
      # unreachable project fails as an error rather than passing as an
      # absence.
      - run: pnpm check-projects

      # The JavaScript projects' targets, always in full — this repository has
      # small suites, so affected selection would buy nothing today. When the
      # tree grows to where it matters, the switch is `moon ci --base=<base>`
      # exactly as archkeep runs it, and this comment is the pointer.
      # console-api-client's `build` is a non-mutating freshness gate: it generates
      # the client from the OpenAPI contract into a temporary directory and
      # fails on any diff against committed source, so a stale contract cannot
      # pass alongside the console's typecheck.
      - name: Lint, test, typecheck and build the JavaScript projects
        run: >-
          pnpm exec moon run console-api-client:lint console-api-client:test console-api-client:typecheck
          console-api-client:build console:lint console:test console:typecheck
          console:build

  verify-go:
    name: Verify (go ${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One leg per Go module under `apps/`, each running the module's own four
    # targets. A matrix rather than three jobs because the three legs are the
    # same run with a different name — and because a fourth module then costs
    # one line instead of thirty.
    #
    # `fail-fast: false` is the point of the matrix for a change that touches
    # more than one module: the default cancels the remaining legs as soon as
    # one fails, so a red run reports the first module to break and hides
    # whether the other two survived the same edit.
    #
    # `integration` marks the legs that own a `test-integration` target. The
    # service containers below are declared once for the job and therefore
    # start for every leg, including the ones that do not use them; declaring
    # them per leg would need a copy of each digest pin per leg, which is
    # exactly the drift the parity step below exists to prevent.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: console-api
            integration: true
          - app: dataplane
            integration: true
          - app: dataplane-api
            integration: false
    # The integration tier's server: the same digest-pinned image the local
    # fixture in `deploy/redis/docker-compose.yml` runs, as a job-scoped
    # service container. One suite, two runners — a developer's compose stack
    # and this job — which is why the image line below and the compose file
    # name the same tag AND digest, byte for byte: the parity step further
    # down re-derives both pins at run time and fails this job if they ever
    # diverge. Compose pins by tag+digest for the same reason; see that
    # directory's README for the verified source and the upgrade procedure.
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        # Loopback-only, like the fixture's own `127.0.0.1:6379:6379`: the
        # suite reaches the server at the same address the README documents,
        # and nothing beyond the runner can dial it.
        ports:
          - 127.0.0.1:6379:6379
        # The compose fixture's healthcheck, verbatim in effect (ping, 2s
        # interval, 1s timeout, 10 retries, 2s start period): a container
        # that will never answer holds a job for the same bounded time in
        # both runners, and the start period is what absorbs a cold image
        # pull rather than spending retries on it.
        #
        # One stated divergence from the fixture: it disables persistence on
        # the server itself (`--save "" --appendonly no`), and a service
        # container cannot override the image's CMD. `--tmpfs /data` buys the
        # property, not the setting — the image writes snapshots and AOF to
        # /data, so on this job any such write lands in memory-backed storage
        # on a container that dies with the runner: nothing durable is
        # written, on an instance that never outlives the job. The suite only
        # exercises SET/GET/DEL, and no consumer may treat this instance as
        # durable regardless.
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10
          --health-start-period 2s
          --tmpfs /data

      # The databases' integration server: the same digest-pinned image the
      # local fixture in `deploy/postgres/compose.yaml` runs, for the same
      # one-suite-two-runners reason as the Valkey container above — the image
      # line and the compose file name the same tag AND digest, and the parity
      # step re-derives both at run time.
      #
      # Two stated divergences from the fixture, both forced by what a service
      # container cannot do:
      #
      # - No `initdb/` mount, so the two plane databases (`control`,
      #   `dataplane`) are not created by the fixture's script. Each
      #   application's postgres integration suite ensures its own plane's
      #   database exists from the admin DSN this job hands it
      #   (POSTGRES_TEST_ADMIN_DSN below) before it runs — the same
      #   ensure-then-connect shape a developer's machine exercises, with the
      #   creation step made explicit instead of delegated to an entrypoint.
      # - No migration runner: the lanes' migrations stay
      #   verify-persistence's subject (`deploy/postgres/verify.sh`, the same
      #   suite a contributor runs). The suites that need a migrated schema
      #   apply their own lane's migrations themselves — console-api's
      #   identity suite through the golang-migrate library the pinned
      #   runner image runs, the dataplane runtime-storage suite by
      #   mirroring golang-migrate's versioning discipline by hand over
      #   `migrations/dataplane`'s `.up.sql` files — while the driver suites
      #   exercise connection, transaction and lifecycle behaviour on probe
      #   tables they create and drop themselves. Each derives the database
      #   it migrates from the admin DSN below, which stays the only
      #   database fact the job supplies.
      #
      # The role is the fixture's own `gateway` role with the fixture's
      # documented development password — in a fresh container that role is
      # the cluster superuser, so the admin DSN a developer uses locally and
      # the one this job sets are the same string. It authorizes a container
      # that dies with the runner, on a loopback-only port; no value here is
      # a production credential. Telemetry is off for the same reason the
      # compose file turns it off.
      postgres:
        image: timescale/timescaledb:2.30.1-pg18@sha256:9dede0e3ccc071cf71935b17f76bf243331df0b1575338c8ac294640fcf12a36
        ports:
          - 127.0.0.1:5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway-dev-only
          TIMESCALEDB_TELEMETRY: "off"
        # The fixture's healthcheck, in effect: pg_isready against the named
        # role and database rather than a TCP probe, with the same intervals
        # and the start period that absorbs a cold image pull.
        options: >-
          --health-cmd "pg_isready -U gateway -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
          --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Go module's floor is owned by the module that requires it:
      # `go-version-file` reads this leg's own `go.mod`, so a module that
      # raises its floor raises it for its own job without a second place to
      # edit. Committing `go.work` does not change this — the workspace pins
      # no toolchain of its own.
      - name: Pin the Go toolchain the ${{ matrix.app }} targets run
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache: false

      # The files that name a service image — this workflow's containers and
      # the compose fixtures a developer runs (`deploy/redis/docker-compose.yml`
      # for Valkey, `deploy/postgres/compose.yaml` for the database) — are
      # written out by hand in both places, and nothing structural ties them
      # together. A one-sided upgrade would leave this job green against a
      # server version no developer has ever executed, which is exactly the
      # drift the suites exist to prevent. This step re-derives every pin from
      # its files at run time instead of comparing against a third hardcoded
      # copy: a third copy is a third place to forget, and this way the compose
      # files stay the single source.
      #
      # Only `image:` declaration lines are read, not the whole file: a pin
      # string surviving in a comment must neither keep a drifted service
      # image passing (parity would compare the comment, not what actually
      # ran) nor fail a job that ran the right image. Absence and ambiguity
      # fail as loudly as divergence — a pin missing from either file, or two
      # distinct pins on either side, means the comparison would prove
      # nothing, so it errors rather than passes. The `|| true` on each
      # extraction keeps an unmatched pattern flowing into the explicit
      # failure branch: `pipefail` would otherwise abort on grep's exit 1
      # before the reason is printed.
      #
      # Before the expensive api checks — the linter tarball download and
      # every suite: this is a few greps, and a drifted pin should fail the
      # job in seconds rather than after minutes of toolchain downloads.
      - name: Assert the CI and local fixture image pins agree
        run: |
          set -euo pipefail

          # One row per pinned service: a display name, the image pattern that
          # identifies exactly that service's pin, and the fixture file that
          # is the single source for it. The workflow side of every row is
          # this file.
          check_pin() {
            name="$1"
            pattern="$2"
            fixture="$3"
            compose="$(grep -E '^[[:space:]]*image:' "$fixture" | grep -ohE "$pattern" | sort -u || true)"
            workflow="$(grep -E '^[[:space:]]*image:' .github/workflows/ci.yml | grep -ohE "$pattern" | sort -u || true)"

            require_single_pin() {
              if [ -z "$2" ]; then
                echo "No $name tag@digest pin found in $1 — both files must carry exactly one" >&2
                exit 1
              fi
              if [ "$(printf '%s\n' "$2" | wc -l)" -gt 1 ]; then
                echo "$1 carries more than one distinct $name pin:" >&2
                printf '%s\n' "$2" >&2
                exit 1
              fi
            }

            require_single_pin "$fixture" "$compose"
            require_single_pin ".github/workflows/ci.yml" "$workflow"

            if [ "$compose" != "$workflow" ]; then
              echo "The $name pins diverge — upgrade both files in the same change:" >&2
              echo "  $fixture                        $compose" >&2
              echo "  .github/workflows/ci.yml $workflow" >&2
              exit 1
            fi
            echo "CI and the local fixture pin the same $name image: $compose"
          }

          check_pin "Valkey" \
            'valkey/valkey:[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}' \
            "deploy/redis/docker-compose.yml"
          check_pin "TimescaleDB" \
            'timescale/timescaledb:[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}' \
            "deploy/postgres/compose.yaml"

      # golangci-lint is downloaded and checksum-pinned rather than taken from
      # the runner image (whose copy moves underneath every job) and rather
      # than an installer action (a second moving piece when the release
      # tarball's digest is already the pin). The digest was read off the
      # v2.12.2 release artifact itself. Each application's `moon.yml` argues
      # the linter roster and why `go vet` is not run beside it.
      #
      # The download itself retries bounded — `--retry 3 --retry-all-errors
      # --retry-delay 10` — because a transient 5xx from the release endpoint
      # must not fail the pipeline on an unchanged tree. The checksum line
      # below stays OUTSIDE the retry on purpose: it fails loudly on a wrong
      # or partial download, and a retry must never paper over bytes that do
      # not match the pin.
      #
      # /usr/local/bin, not $GITHUB_PATH: Moon composes a task's PATH from its
      # toolchain dirs and drops the runner's per-step PATH additions. A system
      # location is on every PATH a task can build.
      - name: Install the pinned golangci-lint the Go lint targets run
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$dir"
          curl --silent --show-error --fail --location \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --output "$dir/golangci-lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz"
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  $dir/golangci-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/golangci-lint.tar.gz" -C "$dir"
          sudo mv "$dir/golangci-lint-2.12.2-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint

      # This module's five targets — gofmt/golangci-lint, go test, go test
      # under the race detector, the compile pass, and the binary. Same
      # always-in-full reasoning as the console step above, and the same five
      # target names in every application, which is what makes the matrix leg
      # a name rather than a list. test-race runs beside test rather than
      # instead of it because the detector sees a different suite: a data race
      # the unsynchronised run schedules around is exactly the one the gate
      # exists to catch.
      - name: Lint, test, typecheck and build ${{ matrix.app }}
        run: >-
          pnpm exec moon run ${{ matrix.app }}:lint ${{ matrix.app }}:test
          ${{ matrix.app }}:test-race ${{ matrix.app }}:typecheck ${{ matrix.app }}:build

      # The integration tier against the service containers above, through the
      # same target a developer runs — the module's `test-integration` is the
      # single definition of the run (its `moon.yml` target owns the
      # required-address and executed-something guards). The Valkey address is
      # the loopback literal the fixture README documents rather than
      # `localhost`: the published port is IPv4, and a resolver answering ::1
      # first would dial nothing. Each suite refuses to run without its
      # explicit variable; the env here is what satisfies that contract in CI.
      #
      # Both variables are named for the server rather than for the protocol
      # family, and each matches the name the adapter under
      # `apps/*/internal/adapters/outbound/` reads — so the names this job
      # sets are the names consumers read, with no translation step in between
      # that nobody would remember to update. POSTGRES_TEST_ADMIN_DSN points
      # at the cluster's maintenance database: the postgres suite derives its
      # plane database from it (ensuring the database exists first — see the
      # service container's divergences above) rather than receiving one
      # ready-made.
      - name: Run the integration suites against the service containers
        if: matrix.integration
        env:
          VALKEY_ADDRESS: 127.0.0.1:6379
          POSTGRES_TEST_ADMIN_DSN: postgres://gateway:gateway-dev-only@127.0.0.1:5432/postgres?sslmode=disable
        run: pnpm exec moon run ${{ matrix.app }}:test-integration

      # The same suites under the race detector, one step after rather than one
      # target beside the other's flags: the concurrency the storage tier is
      # built on — the contended drawdown, the stream's commit-order
      # allocation, the two-session publication race — is exactly the code a
      # data race would corrupt silently, and the unsynchronised run above
      # cannot see one. The suites cost seconds even instrumented; the gate is
      # cheap because the tier was built to be.
      - name: Run the integration suites under the race detector
        if: matrix.integration
        env:
          VALKEY_ADDRESS: 127.0.0.1:6379
          POSTGRES_TEST_ADMIN_DSN: postgres://gateway:gateway-dev-only@127.0.0.1:5432/postgres?sslmode=disable
        run: pnpm exec moon run ${{ matrix.app }}:test-integration-race

  verify-persistence:
    name: Verify (persistence)
    # The database foundation's one definition of green, run verbatim: the
    # same `bash deploy/postgres/verify.sh` a contributor runs, against the
    # same pinned TimescaleDB — startup, both plane databases answering,
    # migration application and rollback, transaction semantics, dirty-state
    # refusal and recovery. What the suite proves and why each step exists:
    # deploy/postgres/README.md. Docker and
    # the compose plugin are preinstalled on the runner, so the job needs no
    # toolchain setup beyond the checkout — no Node, no Go, no full history.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bash deploy/postgres/verify.sh

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    needs: [verify-console, verify-go, verify-persistence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `needs` alone would let a skipped or cancelled job pass as green, since
      # only `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
