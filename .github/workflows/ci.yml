name: CI

on:
  # Deliberately NOT filtered to `branches: [main]`. A filter there skips CI
  # entirely on a stacked pull request — one targeting another feature branch —
  # so the branch merges having never been checked, and the failure only appears
  # later against someone else's change.
  # `types` replaces the default set (opened, synchronize, reopened) rather
  # than adding to it, so `edited` has to name its siblings explicitly. The
  # PR title becomes the subject of the squash commit on `main`, and a title
  # edited to something invalid after the checks went green would otherwise
  # keep its stale pass forever — nothing revalidates it at merge time.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    # `main` is the one development line: its merged tree runs the full suite
    # on every push, so a red push names its commit instead of surfacing in a
    # release lane later.
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-web:
    name: Verify (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Moon's VCS layer wants the base branch ref; a shallow clone lacks
          # it, and the jobs here run Moon. Full history is Moon's own
          # recommended CI setup.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge, which is the entire reason
      # the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # Asserts every directory under `apps/` and `packages/` is a project
      # Moon can see with the four targets. Runs BEFORE the Moon step, so an
      # unreachable project fails as an error rather than passing as an
      # absence.
      - run: pnpm check-projects

      # The JavaScript projects' targets, always in full — this repository has
      # small suites, so affected selection would buy nothing today. When the
      # tree grows to where it matters, the switch is `moon ci --base=<base>`
      # exactly as archkeep runs it, and this comment is the pointer.
      # api-client's `build` is a non-mutating freshness gate: it generates
      # the client from the OpenAPI contract into a temporary directory and
      # fails on any diff against committed source, so a stale contract cannot
      # pass alongside the console's typecheck.
      - name: Lint, test, typecheck and build the JavaScript projects
        run: >-
          pnpm exec moon run api-client:lint api-client:test api-client:typecheck
          api-client:build web:lint web:test web:typecheck web:build

  verify-api:
    name: Verify (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The integration tier's server: the same digest-pinned image the local
    # fixture in `deploy/redis/docker-compose.yml` runs, as a job-scoped
    # service container. One suite, two runners — a developer's compose stack
    # and this job — which is why the image line below and the compose file
    # name the same tag AND digest, byte for byte: the parity step further
    # down re-derives both pins at run time and fails this job if they ever
    # diverge. Compose pins by tag+digest for the same reason; see that
    # directory's README for the verified source and the upgrade procedure.
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        # Loopback-only, like the fixture's own `127.0.0.1:6379:6379`: the
        # suite reaches the server at the same address the README documents,
        # and nothing beyond the runner can dial it.
        ports:
          - 127.0.0.1:6379:6379
        # The compose fixture's healthcheck, verbatim in effect (ping, 2s
        # interval, 1s timeout, 10 retries, 2s start period): a container
        # that will never answer holds a job for the same bounded time in
        # both runners, and the start period is what absorbs a cold image
        # pull rather than spending retries on it.
        #
        # One stated divergence from the fixture: it disables persistence on
        # the server itself (`--save "" --appendonly no`), and a service
        # container cannot override the image's CMD. `--tmpfs /data` buys the
        # property, not the setting — the image writes snapshots and AOF to
        # /data, so on this job any such write lands in memory-backed storage
        # on a container that dies with the runner: nothing durable is
        # written, on an instance that never outlives the job. The suite only
        # exercises SET/GET/DEL, and no consumer may treat this instance as
        # durable regardless.
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10
          --health-start-period 2s
          --tmpfs /data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Go module's floor is owned by the module that requires it:
      # `go-version-file` reads `apps/api/go.mod`.
      - name: Pin the Go toolchain the api targets run
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false

      # The two files that name a Valkey image — this workflow's service
      # container and `deploy/redis/docker-compose.yml`, the fixture a
      # developer runs — are written out by hand in both places, and nothing
      # structural ties them together. A one-sided upgrade would leave this
      # job green against a server version no developer has ever executed,
      # which is exactly the drift the suite exists to prevent. This step
      # re-derives both pins from their files at run time instead of comparing
      # against a third hardcoded copy: a third copy is a third place to
      # forget, and this way the compose file stays the single source.
      #
      # Only `image:` declaration lines are read, not the whole file: a pin
      # string surviving in a comment must neither keep a drifted service
      # image passing (parity would compare the comment, not what actually
      # ran) nor fail a job that ran the right image. Absence and ambiguity
      # fail as loudly as divergence — a pin missing from either file, or two
      # distinct pins on either side, means the comparison would prove
      # nothing, so it errors rather than passes. The `|| true` on each
      # extraction keeps an unmatched pattern flowing into the explicit
      # failure branch: `pipefail` would otherwise abort on grep's exit 1
      # before the reason is printed.
      #
      # Before the expensive api checks — the linter tarball download and
      # every suite: this is two greps, and a drifted pin should fail the
      # job in seconds rather than after minutes of toolchain downloads.
      - name: Assert the CI and local fixture Valkey pins agree
        run: |
          set -euo pipefail
          pattern='valkey/valkey:[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}'
          compose="$(grep -E '^[[:space:]]*image:' deploy/redis/docker-compose.yml | grep -ohE "$pattern" | sort -u || true)"
          workflow="$(grep -E '^[[:space:]]*image:' .github/workflows/ci.yml | grep -ohE "$pattern" | sort -u || true)"

          require_single_pin() {
            if [ -z "$2" ]; then
              echo "No Valkey tag@digest pin found in $1 — both files must carry exactly one" >&2
              exit 1
            fi
            if [ "$(printf '%s\n' "$2" | wc -l)" -gt 1 ]; then
              echo "$1 carries more than one distinct Valkey pin:" >&2
              printf '%s\n' "$2" >&2
              exit 1
            fi
          }

          require_single_pin "deploy/redis/docker-compose.yml" "$compose"
          require_single_pin ".github/workflows/ci.yml" "$workflow"

          if [ "$compose" != "$workflow" ]; then
            echo "The Valkey pins diverge — upgrade both files in the same change:" >&2
            echo "  deploy/redis/docker-compose.yml  $compose" >&2
            echo "  .github/workflows/ci.yml         $workflow" >&2
            exit 1
          fi
          echo "CI and the local fixture pin the same image: $compose"

      # golangci-lint is downloaded and checksum-pinned rather than taken from
      # the runner image (whose copy moves underneath every job) and rather
      # than an installer action (a second moving piece when the release
      # tarball's digest is already the pin). The digest was read off the
      # v2.12.2 release artifact itself. The `lint` target in
      # `apps/api/moon.yml` argues the linter roster and why `go vet` is not
      # run beside it.
      #
      # The download itself retries bounded — `--retry 3 --retry-all-errors
      # --retry-delay 10` — because a transient 5xx from the release endpoint
      # must not fail the pipeline on an unchanged tree. The checksum line
      # below stays OUTSIDE the retry on purpose: it fails loudly on a wrong
      # or partial download, and a retry must never paper over bytes that do
      # not match the pin.
      #
      # /usr/local/bin, not $GITHUB_PATH: Moon composes a task's PATH from its
      # toolchain dirs and drops the runner's per-step PATH additions. A system
      # location is on every PATH a task can build.
      - name: Install the pinned golangci-lint the api lint target runs
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$dir"
          curl --silent --show-error --fail --location \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --output "$dir/golangci-lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz"
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  $dir/golangci-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/golangci-lint.tar.gz" -C "$dir"
          sudo mv "$dir/golangci-lint-2.12.2-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint

      # The API's four targets — gofmt/vet via golangci-lint, go test, the
      # compile pass, and the binary. Same always-in-full reasoning as the
      # web step above.
      - name: Lint, test, typecheck and build the api
        run: pnpm exec moon run api:lint api:test api:typecheck api:build

      # The integration tier against the service container above, through the
      # same target a developer runs — `api:test-integration` is the single
      # definition of the run (the `apps/api/moon.yml` target owns the
      # required-address and executed-something guards). The address is the
      # loopback literal the fixture README documents rather than `localhost`:
      # the published port is IPv4, and a resolver answering ::1 first would
      # dial nothing. The suite itself refuses to run without an explicit
      # address; the variable here is what satisfies that contract in CI.
      - name: Run the Redis integration suite against the service container
        env:
          REDIS_ADDRESS: 127.0.0.1:6379
        run: pnpm exec moon run api:test-integration

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    needs: [verify-web, verify-api]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `needs` alone would let a skipped or cancelled job pass as green, since
      # only `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
