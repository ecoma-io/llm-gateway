# The web console project.
#
# The tasks call the tools directly — `eslint`, `vitest`, `vue-tsc`, `vite` —
# the same shape every JavaScript package in this organisation uses. Two
# conventions make that work:
#
# - The whole JS toolchain is a root devDependency (`eslint`, `vitest`,
#   `vue-tsc`, `vite`, … in the root package.json); this package declares only
#   its runtime deps. Tool resolution rides on how Moon is invoked, not on
#   Moon itself: every sanctioned entry point (the root scripts, CI,
#   lefthook) runs `pnpm exec moon run …`, and `pnpm exec` puts the workspace
#   root's `node_modules/.bin` on the PATH the tasks inherit. A bare
#   `moon run` from a shell without that directory fails exit 127.
# - Deliberately NOT `pnpm exec …`: a `pnpm` invocation is routed through
#   Moon's proto toolchain layer, which pins the version out of
#   `packageManager` and demands a proto-installed pnpm — a second pnpm
#   nobody needs when the one on PATH is already the pinned one.
#
# The package.json scripts (`lint`, `test`, `typecheck`, `build`) name the same
# commands for the in-directory DX the Vite conventions give; the moon tasks
# are what CI and the root `pnpm lint`/`test`/`typecheck`/`build` run.
#
# The four task keys sit at exactly two spaces of indent — the root
# scripts/check-projects.mjs scans moon.yml files for these four keys and
# fails a project that declares fewer targets than CI runs, because Moon
# skips a target that does not exist and exits 0 having run nothing.
id: web
language: javascript
tasks:
  lint:
    command: eslint . --max-warnings 0
    inputs:
      - "**/*"
      - "/packages/api-client/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/eslint.config.mjs"
  test:
    command: vitest run
    inputs:
      - "**/*"
      - "/api/openapi/openapi.yaml"
      - "/packages/api-client/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
  typecheck:
    command: vue-tsc --noEmit
    inputs:
      - "**/*"
      # A package dependency and the contract that generates it are external
      # inputs: without them Moon can replay a cached web green after a client
      # type changes, hiding exactly the contract drift this boundary prevents.
      - "/api/openapi/openapi.yaml"
      - "/packages/api-client/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
  build:
    command: vite build
    inputs:
      - "**/*"
      - "/api/openapi/openapi.yaml"
      - "/packages/api-client/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
