# A workspace from the first commit: `apps/` holds the four applications of
# this repository — the Vue console (`apps/console`), the Control Plane API
# (`apps/console-api`), the Data Plane runtime (`apps/dataplane`) and the Data
# Plane management API (`apps/dataplane-api`) — and `packages/` holds the
# libraries they share, starting with the generated console client. Only the
# console is a pnpm project: the three Go applications are modules of their own
# (go.work), and Moon sees all four. Globs rather than an explicit map, so a new
# project registers itself the moment its `moon.yml` lands;
# `scripts/check-projects.mjs` is what turns
# a directory Moon cannot see into a red check instead of a silent skip.
packages:
  - "apps/*"
  - "packages/*"

# Every dependency install script is blocked until it is decided on here, and
# pnpm fails the install while any decision is missing — so an unreviewed
# postinstall cannot run in CI just because it shipped in a new release.
#
# lefthook: false — its postinstall only runs `lefthook install`, which this
# package's `prepare` script already does, and which lefthook itself skips
# whenever `CI` is set. The binary comes from optionalDependencies and needs no
# build step, so nothing is lost by never running it.
allowBuilds:
  lefthook: false
  # vue-demi: false — pinia's Vue 2/3 compatibility shim. Its postinstall
  # rewrites the package's entry points to target Vue 2; the published
  # default already targets Vue 3, the only Vue this repository runs, so the
  # script has nothing to do here and stays blocked.
  vue-demi: false
  # @scarf/scarf: false — a transitive dependency of @stoplight/spectral-cli,
  # and a telemetry package rather than a build step. Its postinstall reports
  # the install to a third-party analytics endpoint; nothing in this repository
  # depends on its output, and a linter has no business telling anyone outside
  # the deployment that a developer ran pnpm install. Denied for the same
  # reason every other entry here is: an install script that runs unreviewed is
  # the shortest path from a dependency to a compromised machine.
  "@scarf/scarf": false

minimumReleaseAgeExclude:
  - "@ecoma-io/loom@0.8.3"
