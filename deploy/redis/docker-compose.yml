# Disposable Redis-compatible service for local development and the opt-in
# integration suite. This is intentionally not a production topology and is
# deliberately separate from any application compose stack.
#
# The tag is readable; the digest is the immutable pin. It resolves the
# manifest list published for Valkey 9.1.2 on 2026-09-23 — see README.md for
# the verified source links and update procedure.
services:
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
